        documents: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, type: { type: string }, format: { type: [string, "null"] }, bytes: { type: [integer, "null"] }, status: { type: string }, uploadedAt: { type: string, format: date-time } } } }
        payoutAccount: { type: [object, "null"], properties: { method: { type: string }, bankName: { type: [string, "null"] }, accountName: { type: string }, last4: { type: string }, verified: { type: boolean } } }
        checks: { type: array, items: { type: object, properties: { key: { type: string, enum: [store_details, business_details, gov_id, business_certificate, payout_account] }, label: { type: string }, passed: { type: boolean } } } }
        review: { type: [object, "null"], properties: { by: { type: [string, "null"] }, at: { type: string, format: date-time }, note: { type: [string, "null"] } } }
        canReview: { type: boolean, description: Waiting for review (Approve / Ask for changes / Reject). }
        history: { type: array, description: From the audit log, newest first (decisions and every look at the TIN or a document)., items: { type: object, properties: { action: { type: string, example: store.view_tin }, by: { type: string }, at: { type: string, format: date-time }, metadata: {} } } }
