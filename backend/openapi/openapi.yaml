openapi: 3.1.0
info:
  title: Vendora API
  version: 0.17.0
  description: |
    Backend for Vendora, a multi-vendor marketplace (Philippines, prices in ₱).
    Platform basics (milestone 1): health checks, the error format, request IDs and rate limiting.
    Sign-in (milestone 3a): create account, verify email, sign in/out, stay signed in.
    Passwords (milestone 3b): forgot, reset from an emailed link, change while signed in.
    Two-step verification (milestone 3c): authenticator app, backup codes, trusted devices.
    Account security (milestone 3d): "Confirm it's you", signed-in devices, security activity, change email.
    Google sign-in (milestone 3e): "Continue with Google" (authorization code + PKCE), connect and disconnect.
    Catalog (milestone 4a): categories, product search with filters and sort, product pages.
    Money is always an integer number of centavos (₱7,499 = 749900).

    **How signing in works**
    - Signing in sets two httpOnly cookies that page JavaScript cannot read:
      a 15-minute access pass (`vd_at`, a JWT) and a refresh pass (`vd_rt`, random,
      only sent to `/api/v1/auth`). When an API call answers 401, call `POST /api/v1/auth/refresh`
      once, then retry the call.
    - Every POST/PUT/PATCH/DELETE must send the `X-CSRF-Token` header. Get a token from
      `GET /api/v1/auth/csrf` when the app loads. Sign-in, sign-out and email verification
      return a new token, because the old one stops working when you sign in or out.
    - In production the cookies get the `__Host-` / `__Secure-` prefixes and the Secure flag.
    - If Redis is briefly unavailable, browsing and signed-in use keep working, but sign-in, sign-up,
      code and password endpoints answer 503 SERVICE_UNAVAILABLE (see Retry-After) instead of
      running without brute-force protection.
servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: platform
  - name: auth
    description: Sign-in and session endpoints (milestone 3a)
  - name: security
    description: Security settings (milestone 3d)
  - name: google
    description: Google sign-in (milestone 3e)
  - name: catalog
    description: What shoppers browse, public (milestone 4a)
  - name: stores
    description: Store pages and following stores (milestone 4b)
  - name: reviews
    description: Reading product and store reviews (milestone 4b); writing your own (milestone 5c)
  - name: home
    description: The Home page's sections (milestone 4c)
  - name: wishlist
    description: Saved products and price drops (milestone 4c)
  - name: cart
    description: The cart, for guests and signed-in shoppers (milestone 5a)
  - name: addresses
    description: Saved delivery addresses (milestone 5a)
  - name: checkout
    description: Checkout, orders and PayMongo payments (milestone 5b); your orders, tracking and buy again (milestone 5c)
  - name: seller
    description: Seller Center, becoming a seller (milestone 6a) and products (milestone 6b)
  - name: notifications
    description: Email settings and the one-click unsubscribe in price-drop emails (milestone 6b)
  - name: admin
    description: |
      Admin pages (milestone 7). An ADMIN account with two-step verification on, checked in the database on
      every request, holding the role a page needs: SUPPORT (seller applications, payout accounts, users, stores), FINANCE
      (payouts and refunds), MODERATION. Every action, and every look at sensitive data, is written to the audit
      log; actions that move or decide where money goes also need "Confirm it's you".

paths:
  /health:
    get:
      summary: Liveness — is the process up?
      description: |
        Never touches the database or Redis, so it stays fast and cheap for uptime monitors.
        Not rate-limited (monitors call it often and it has no dependencies).
      operationId: getHealth
      tags: [platform]
      responses:
        "200":
          description: The API process is running.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, uptimeSeconds: 12.4 }

  /ready:
    get:
      summary: Readiness — can the API serve traffic?
      description: |
        Checks every dependency (Redis and PostgreSQL) with a short timeout.
        A dependency that is not configured is reported as "not_configured" and does not fail
        readiness in development (production refuses to start without them).
        Failure details are logged on the server only, never returned.
      operationId: getReady
      tags: [platform]
      responses:
        "200":
          description: Every configured dependency answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
              example: { status: ready, checks: { redis: ok, database: not_configured } }
        "503":
          description: At least one configured dependency failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
              example: { status: not_ready, checks: { redis: error, database: ok } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/csrf:
    get:
      summary: Get a CSRF token (call once when the app loads)
      description: Sets the CSRF cookies and returns the token to send in `X-CSRF-Token`.
      operationId: getCsrfToken
      tags: [auth]
      responses:
        "200":
          description: A token for this browser.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }

  /api/v1/auth/register:
    post:
      summary: Create a shopper account and email a 6-digit verification code
      description: |
        Always answers 202 with the same body, whether or not the email already has an account,
        so nobody can use this form to find out who shops on Vendora. If the email is already
        registered and verified, its owner gets a "someone tried to sign up" email instead of a code.
        If it's registered but not yet verified, the new name and password replace the old ones
        (whoever proves they own the inbox wins).
      operationId: register
      tags: [auth]
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: A code was sent if this email can be verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSent" }
        "400":
          description: |
            VALIDATION_ERROR. Includes passwords shorter than 8 characters and passwords found in
            known data breaches (field `password`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/verify-email:
    post:
      summary: Confirm the email with the 6-digit code, then sign in
      description: |
        A code works once, expires after 10 minutes and allows 5 tries. After that, request a new one.
        Wrong, expired and used-up codes all get the same INVALID_CODE answer.
      operationId: verifyEmail
      tags: [auth]
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400":
          description: INVALID_CODE or VALIDATION_ERROR.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/resend-verification:
    post:
      summary: Send a new verification code ("Didn't get the code?")
      description: Always 202. At most one email per minute per address; older codes stop working.
      operationId: resendVerification
      tags: [auth]
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202":
          description: A new code was sent if the account exists and still needs verifying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSent" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/login:
    post:
      summary: Sign in with email and password
      description: |
        After 5 wrong passwords for the same account from the same network, sign-in pauses for
        15 minutes (ACCOUNT_LOCKED), then unlocks by itself. Wrong attempts for emails that have no
        account are counted the same way, so the answers never reveal whether an account exists.
        20 failures for one account from anywhere also pause it (protects against attacks from many IPs).
      operationId: login
      tags: [auth]
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/SignInStep" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: INVALID_CREDENTIALS, with `details.attemptsLeft` before the pause.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: INVALID_CREDENTIALS, message: "Email or password is incorrect.", requestId: "…", details: { attemptsLeft: 2 } }
        "403":
          description: |
            EMAIL_NOT_VERIFIED (password was right; show the verify screen. A new code is emailed unless one
            was sent in the last minute) or
            ACCOUNT_SUSPENDED, or CSRF_INVALID.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: ACCOUNT_LOCKED (`details.retryAfterSeconds` and the Retry-After header say when to try again) or RATE_LIMITED.
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until sign-in unlocks. }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/refresh:
    post:
      summary: Swap the refresh pass for new passes (keeps you signed in)
      description: |
        Uses the `vd_rt` cookie. Each refresh pass works once. If an old one is used again
        (a sign it was copied), every device in that sign-in chain is signed out.
        If two tabs refresh at the same moment, the slower one gets 409 and should just retry its request.
      operationId: refresh
      tags: [auth]
      security: [{ refreshCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: New cookies are set. The CSRF token stays the same.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Not signed in (missing, expired, revoked or reused refresh pass). Cookies are cleared.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "409":
          description: CONFLICT. Another tab refreshed a moment ago; retry the original request.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/auth/logout:
    post:
      summary: Sign out on this device
      description: Revokes this device's sign-in, makes its access pass unusable at once, and clears the cookies.
      operationId: logout
      tags: [auth]
      security: [{ csrfHeader: [] }]
      responses:
        "200":
          description: Signed out. Use the new CSRF token from now on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }

  /api/v1/auth/forgot-password:
    post:
      summary: Email a password-reset link ("Forgot password?")
      description: |
        Always answers 202 with the same body, whether or not the email has an account.
        The link (`{APP_URL}/reset-password#token=…`) works once and expires after 30 minutes;
        asking again cancels the older link. At most 1 email a minute and 5 a day per address.
        The token sits after "#", so browsers never send it to a server or to other websites.
      operationId: forgotPassword
      tags: [auth]
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202":
          description: A link was sent if the account exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetLinkSent" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/reset-password:
    post:
      summary: Choose a new password from the emailed link, then sign in
      description: |
        Every device is signed out and this one is signed in ("You'll be signed out everywhere else").
        It also verifies the email if it wasn't yet and lifts the 15-minute sign-in pause.
        A rejected password (too short, breached) doesn't use up the link.
        The account owner gets a "your password was changed" email.
      operationId: resetPassword
      tags: [auth]
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/SignInStep" }
        "400":
          description: INVALID_LINK (expired, used or made-up) or VALIDATION_ERROR (field `password` or `token`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/two-factor-reset:
    post:
      summary: Confirm Support's reset of two-step verification (from the emailed link)
      description: |
        The owner's half of "Reset two-step verification" (milestone 7c): Support started it after checking
        who they are; this link (24 hours, once; a newer request cancels it) proves the inbox is theirs. No
        sign-in needed. Two-step verification, backup codes and trusted devices are removed, every sign-in
        ends at once, and the owner is emailed. Sellers must set it up again at their next sign-in.
      operationId: confirmTwoFactorReset
      tags: [auth]
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: From the link's fragment (after "#token="). }
      responses:
        "200":
          description: Two-step verification is off; sign in with the password.
          content: { application/json: { schema: { type: object, required: [reset], properties: { reset: { const: true } } } } }
        "400":
          description: INVALID_LINK (expired, used, cancelled by a newer request or by a suspension, or made-up) or VALIDATION_ERROR (`token`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: ACCOUNT_SUSPENDED, or CSRF_INVALID.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/change-password:
    post:
      summary: Change the password while signed in
      description: |
        Needs the current password. Wrong ones count toward the same 5-try lockout as sign-in
        (`details.attemptsLeft`, then ACCOUNT_LOCKED). Every other device is signed out at once;
        this one stays signed in with new cookies (the CSRF token stays the same).
        The owner gets a "your password was changed" email.
      operationId: changePassword
      tags: [auth]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password changed; new cookies are set.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400":
          description: |
            VALIDATION_ERROR: `currentPassword` wrong (with `details.attemptsLeft`), or `newPassword`
            too short, breached, or the same as the current one.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "429":
          description: ACCOUNT_LOCKED after 5 wrong current passwords, or RATE_LIMITED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/2fa/verify:
    post:
      summary: Finish signing in with the authenticator code (or a backup code)
      description: |
        After sign-in or a password reset answered `two_factor_required`. That step lives in the httpOnly
        `vd_2fa` cookie for 5 minutes and allows 5 tries; wrong codes also count toward the account's
        sign-in lockout. Send either `code` (6 digits) or `backupCode`. A code can't be used twice.
        With `trustDevice`, this browser skips the code for 30 days (httpOnly `vd_td` cookie).
      operationId: verifyTwoFactor
      tags: [auth]
      security: [{ challengeCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorVerifyRequest" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400":
          description: INVALID_CODE (with `details.attemptsLeft`), CHALLENGE_EXPIRED (sign in again) or VALIDATION_ERROR.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "429":
          description: ACCOUNT_LOCKED (too many wrong codes or passwords) or RATE_LIMITED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/2fa:
    get:
      summary: Two-step verification status (Security settings)
      operationId: getTwoFactorStatus
      tags: [auth]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: Whether it's on, whether this account must have it, and how many backup codes are left.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/auth/2fa/setup:
    post:
      summary: Start turning on two-step verification
      description: |
        Signed in, or during sign-in for sellers and admins who got `two_factor_setup_required`.
        Returns the `otpauth://` link to show as a QR code (draw it in the browser; never send it to a
        QR web service, it contains the secret) and the key to type in by hand. Nothing changes until
        `/2fa/enable` succeeds; starting again replaces the pending secret.
      operationId: startTwoFactorSetup
      tags: [auth]
      security: [{ accessCookie: [], csrfHeader: [] }, { challengeCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: The link for the QR code and the manual key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "401":
          description: UNAUTHORIZED. Not signed in and no set-up step in progress.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "409":
          description: CONFLICT. Two-step verification is already on.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/2fa/enable:
    post:
      summary: Confirm the first code from the app; turns two-step verification on
      description: |
        Returns 10 backup codes, shown only this once (only hashes are stored). During a seller/admin
        sign-in this also signs in, so the response is SignedIn plus `backupCodes`.
        The owner gets a "two-step verification is on" email.
      operationId: enableTwoFactor
      tags: [auth]
      security: [{ accessCookie: [], csrfHeader: [] }, { challengeCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCodeRequest" }
      responses:
        "200":
          description: On. Signed-in users get `{ backupCodes }`; the sign-in set-up step gets SignedIn + `backupCodes`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BackupCodes" }
                  - { $ref: "#/components/schemas/SignedIn" }
        "400":
          description: INVALID_CODE, CHALLENGE_EXPIRED or VALIDATION_ERROR.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: UNAUTHORIZED. Not signed in and no set-up step in progress.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "409":
          description: CONFLICT. Already on, or set-up wasn't started.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/2fa/disable:
    post:
      summary: Turn two-step verification off (shoppers only)
      description: |
        Needs a current app code or a backup code; wrong ones count toward the lockout. Backup codes are
        deleted and no device stays trusted. Sellers and admins get 403: it's required for them.
        The owner gets a "two-step verification was turned off" email.
      operationId: disableTwoFactor
      tags: [auth]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecondFactorRequest" }
      responses:
        "200":
          description: Off.
          content:
            application/json:
              schema: { type: object, required: [enabled], properties: { enabled: { type: boolean, const: false } } }
        "400":
          description: INVALID_CODE (with `details.attemptsLeft`) or VALIDATION_ERROR.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: FORBIDDEN (required for sellers and admins) or CSRF_INVALID.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: CONFLICT. Already off.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: ACCOUNT_LOCKED or RATE_LIMITED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/2fa/backup-codes:
    post:
      summary: Get a new set of 10 backup codes (the old ones stop working)
      description: Needs a current app code (not a backup code). Old codes can't be shown again; only hashes are stored.
      operationId: renewBackupCodes
      tags: [auth]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCodeRequest" }
      responses:
        "200":
          description: The new codes, shown only this once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupCodes" }
        "400":
          description: INVALID_CODE or VALIDATION_ERROR.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "409":
          description: CONFLICT. Two-step verification is off.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: ACCOUNT_LOCKED or RATE_LIMITED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/security:
    get:
      summary: Everything the Security settings page shows at the top
      operationId: getSecurityOverview
      tags: [security]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: Email, password, two-step verification, and which proof "Confirm it's you" will ask for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityOverview" }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/auth/confirm:
    get:
      summary: Which proof "Confirm it's you" needs, and whether it was done recently
      operationId: getConfirmStatus
      tags: [security]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: The method to show in the modal, and seconds left if already confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmStatus" }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      summary: Confirm it's you (before sensitive changes)
      description: |
        Send `code` (authenticator app, or the emailed code for accounts without a password) or `password`,
        whichever GET /auth/confirm says. Wrong ones count toward the sign-in lockout. Success lasts
        10 minutes, on this device only. Sensitive actions answer 403 REAUTH_REQUIRED until then.
      operationId: confirmItsYou
      tags: [security]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmRequest" }
      responses:
        "200":
          description: Confirmed for 10 minutes on this device.
          content:
            application/json:
              schema:
                type: object
                required: [confirmed, expiresInSeconds]
                properties:
                  confirmed: { type: boolean, const: true }
                  expiresInSeconds: { type: integer, example: 600 }
        "400":
          description: INVALID_CODE or VALIDATION_ERROR (a wrong password is a field error on `password` with `details.attemptsLeft`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "429":
          description: ACCOUNT_LOCKED or RATE_LIMITED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/confirm/send-code:
    post:
      summary: Email the 6-digit "Confirm it's you" code (accounts without a password)
      description: At most one email a minute and ten account emails a day; within the minute the earlier code still works.
      operationId: sendConfirmCode
      tags: [security]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "202":
          description: The code was sent (or one sent less than a minute ago still works).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeSent" }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "409":
          description: CONFLICT. This account confirms with its password or authenticator app instead.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/sessions:
    get:
      summary: Where you're signed in
      description: One entry per device, this device first. "Last active" is accurate to about 15 minutes (the access pass lifetime).
      operationId: listSessions
      tags: [security]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: Active sign-ins.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/DeviceSession" } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/auth/sessions/sign-out-others:
    post:
      summary: Sign out of all other devices
      description: |
        Every other sign-in ends immediately (including passes already issued) and no other browser stays
        trusted for two-step verification. This device stays signed in. No "Confirm it's you" needed: it's a
        protective action.
      operationId: signOutOtherDevices
      tags: [security]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: How many devices were signed out.
          content:
            application/json:
              schema: { type: object, required: [signedOut], properties: { signedOut: { type: integer, example: 2 } } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }

  /api/v1/auth/sessions/{id}/sign-out:
    post:
      summary: Sign out one device
      description: Takes effect immediately. On this device's own row it's a normal sign-out (cookies cleared, new CSRF token).
      operationId: signOutDevice
      tags: [security]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: The device id from GET /auth/sessions. }
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                required: [signedOut, current]
                properties:
                  signedOut: { type: boolean, const: true }
                  current: { type: boolean, description: True if it was this device. }
                  csrfToken: { type: string, description: Only when current is true. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404":
          description: NOT_FOUND. That device isn't signed in (or isn't yours).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/auth/activity:
    get:
      summary: Recent security activity
      description: |
        Newest first. Single failed sign-ins are left out; a sign-in pause appears as LOCKED
        ("5 failed sign-in attempts — sign-in paused 15 min"). For older entries pass `before` = the last id.
      operationId: listSecurityActivity
      tags: [security]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [events, nextCursor]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/SecurityEvent" } }
                  nextCursor: { type: [string, "null"], format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/auth/email/change:
    post:
      summary: Change email address, step 1 (needs "Confirm it's you")
      description: Emails a 6-digit code to the NEW address to prove it's yours. At most one code a minute per address.
      operationId: startEmailChange
      tags: [security]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeEmailRequest" }
      responses:
        "202":
          description: Code sent to the new address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSent" }
        "400":
          description: VALIDATION_ERROR on `newEmail` (invalid, your current address, or used by another account).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: REAUTH_REQUIRED (open "Confirm it's you", then retry) or CSRF_INVALID.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/email/change/confirm:
    post:
      summary: Change email address, step 2 (the code from the new inbox)
      description: |
        The address changes and counts as verified. Reset links and codes sent to the old address stop
        working, and the old address gets a "your email was changed" notice.
      operationId: confirmEmailChange
      tags: [security]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCodeRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/User" } } }
        "400":
          description: INVALID_CODE or VALIDATION_ERROR.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "409":
          description: CONFLICT. Another account started using that address meanwhile.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/google:
    get:
      summary: Is "Continue with Google" available?
      description: False when the server has no Google client configured; the page then hides the button.
      operationId: getGoogleSignIn
      tags: [google]
      responses:
        "200":
          description: Whether the button should be shown.
          content:
            application/json:
              schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }

  /api/v1/auth/google/start:
    get:
      summary: '"Continue with Google": a page load (not fetch) that redirects to Google'
      description: |
        Sets the encrypted, httpOnly `vd_oauth` cookie (state, nonce, PKCE verifier; 10 minutes;
        SameSite=Lax so it survives the trip back from Google) and redirects to Google's account chooser.
        `mode=connect` (Security settings) needs a signed-in user who did "Confirm it's you".
        Problems redirect to the frontend instead (see GoogleRedirects).
      operationId: startGoogleSignIn
      tags: [google]
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [sign_in, connect], default: sign_in } }
        - { name: keepSignedIn, in: query, schema: { type: string, enum: ["true", "false"], default: "false" } }
      responses:
        "302":
          description: To Google, or to a frontend page with `?error=…`.
          headers:
            Location: { schema: { type: string, format: uri } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/google/callback:
    get:
      summary: Where Google sends the browser back (registered as the redirect URI)
      description: |
        Exchanges the one-time code with Google (server to server, client secret + PKCE), checks the
        signed ID token (issuer, audience, nonce, expiry), then always redirects to the frontend:

        | Result | Redirect |
        |---|---|
        | Signed in (cookies set; then GET /auth/csrf) | `{APP_URL}/` |
        | Enter the 2FA code (vd_2fa cookie) | `{APP_URL}/sign-in?step=two-factor` |
        | Seller/admin must set up 2FA | `{APP_URL}/sign-in?step=two-factor-setup` |
        | Email already has a password account: enter it once to connect | `{APP_URL}/sign-in?step=google-link` |
        | Connected from Security settings | `{APP_URL}/account/security?google=connected` |
        | Problem | `{APP_URL}/sign-in?error=…` or `/account/security?error=…` |

        Error codes: google_cancelled, google_failed (expired, forged or replayed), google_email_unverified,
        google_already_used, google_account_mismatch, account_suspended, reauth_required, sign_in_required,
        google_unavailable.
      operationId: googleCallback
      tags: [google]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: Set by Google, e.g. access_denied when the person cancels. }
      responses:
        "302":
          description: To a frontend page (see the table).
          headers:
            Location: { schema: { type: string, format: uri } }

  /api/v1/auth/google/link:
    post:
      summary: "\"This email already has a Vendora account. Sign in with your password to connect Google.\""
      description: |
        After the callback answered `step=google-link` (vd_2fa cookie, 10 minutes). The password counts toward
        the sign-in lockout. With 2FA on, the answer is `two_factor_required` and Google is connected after the code.
      operationId: linkGoogleWithPassword
      tags: [google]
      security: [{ challengeCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string, maxLength: 128 } } }
      responses:
        "200": { $ref: "#/components/responses/SignInStep" }
        "400":
          description: CHALLENGE_EXPIRED (start again) or VALIDATION_ERROR.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: INVALID_CREDENTIALS, with `details.attemptsLeft`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "409":
          description: CONFLICT. That Google account was connected to another Vendora account meanwhile.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: ACCOUNT_LOCKED or RATE_LIMITED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/auth/google/disconnect:
    post:
      summary: Disconnect Google sign-in (needs "Confirm it's you" and a password on the account)
      operationId: disconnectGoogle
      tags: [google]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Disconnected. The owner gets an email.
          content:
            application/json:
              schema: { type: object, required: [connected], properties: { connected: { type: boolean, const: false } } }
        "401":
          description: UNAUTHORIZED. Not signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: REAUTH_REQUIRED (open "Confirm it's you", then retry) or CSRF_INVALID.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: CONFLICT. No password yet (add one with Forgot password? first), or Google isn't connected.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/categories:
    get:
      summary: The category tree with product counts
      description: Counts include sub-categories and only products shoppers can see. Cached for 5 minutes.
      operationId: listCategories
      tags: [catalog]
      responses:
        "200":
          description: Top-level categories with their children.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories: { type: array, items: { $ref: "#/components/schemas/CategoryNode" } }

  /api/v1/products:
    get:
      summary: Search and browse products (filters, sort, page numbers)
      description: |
        Visible products only: active, from an approved store, with something on sale. The price shown is
        the cheapest variant after deal rules ("from ₱…").

        `q` uses search-engine syntax: `"exact phrase"`, `-exclude`, `or`. Words match through full-text search
        (so "headphone" finds "Headphones"); if they match nothing, similar spellings are used instead
        (`matchMode: similar`, e.g. "hedphones"). Facet counts for each filter ignore that filter itself,
        so the panel can show what the other choices would give.
      operationId: searchProducts
      tags: [catalog]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, example: "pink wireless earbuds" }
        - { name: category, in: query, description: Category slug, includes sub-categories. Repeat for several., schema: { type: array, maxItems: 10, items: { type: string } }, style: form, explode: true }
        - { name: store, in: query, description: Store slug. Repeat for several., schema: { type: array, maxItems: 20, items: { type: string } }, style: form, explode: true }
        - { name: minPrice, in: query, description: Centavos., schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, description: Centavos., schema: { type: integer, minimum: 0 } }
        - { name: rating, in: query, description: '"4★ & up"', schema: { type: integer, minimum: 1, maximum: 4 } }
        - { name: freeDelivery, in: query, description: Only products that reach the free-delivery minimum (₱999) on their own., schema: { type: string, enum: ["true", "false"] } }
        - { name: deal, in: query, description: "Only products on a deal (a crossed-out price that has not ended); the store page's Deals chip.", schema: { type: string, enum: ["true", "false"] } }
        - { name: sort, in: query, description: "top_rated uses a weighted rating (5 imaginary 4-star reviews added), so a few 5-star reviews do not outrank hundreds of good ones.", schema: { type: string, enum: [featured, best_selling, newest, price_asc, price_desc, top_rated], default: featured } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [12, 24, 48], default: 24 } }
      responses:
        "200":
          description: One page of results with the filter panel's counts.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/products/{id}:
    get:
      summary: The product page
      operationId: getProduct
      tags: [catalog]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Everything the product page shows.
          content:
            application/json:
              schema: { type: object, required: [product], properties: { product: { $ref: "#/components/schemas/ProductDetail" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/products/{id}/related:
    get:
      summary: Related products (best sellers from the same category)
      operationId: getRelatedProducts
      tags: [catalog]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Up to 8 product cards, never the product itself.
          content:
            application/json:
              schema: { type: object, required: [products], properties: { products: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/ProductCard" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/products/{id}/reviews:
    get:
      summary: A product's reviews (Reviews tab)
      description: |
        Every review is a verified purchase (it must be linked to a bought item). The summary always
        describes all published reviews (the star bars); `rating` filters the list only. Reviewers
        appear as first name + initial. 404 whenever the product page itself would be.
      operationId: listProductReviews
      tags: [reviews]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/ReviewRating"
        - $ref: "#/components/parameters/ReviewSort"
        - $ref: "#/components/parameters/ReviewPage"
      responses:
        "200":
          description: The rating summary and one page of reviews (10 per page).
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/products/cards:
    get:
      summary: Product cards by id ("Recently viewed")
      description: |
        The browser remembers what the shopper viewed and asks for those cards here, newest first.
        Cards come back in the order given; products that aren't visible any more are left out.
      operationId: getProductCards
      tags: [catalog]
      parameters:
        - { name: ids, in: query, required: true, description: "Comma-separated product ids, at most 20.", schema: { type: string }, example: "0193c0de-0000-7000-8000-000000000001,0193c0de-0000-7000-8000-000000000002" }
      responses:
        "200":
          description: The cards, in the order asked for.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { type: object, required: [products], properties: { products: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ProductCard" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/home:
    get:
      summary: The Home page's data sections
      description: |
        Shop by category, Today's deals (running countdowns, ending soonest first), Best sellers and
        Top-rated stores. The same for every visitor and cached for a minute, so prices here can be up
        to a minute old (checkout always re-reads them).
      operationId: getHome
      tags: [home]
      responses:
        "200":
          description: The Home sections.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomePage" }

  /api/v1/wishlist:
    get:
      summary: My wishlist
      description: Newest first. Products no longer sold stay on the list as unavailable until removed.
      operationId: getWishlist
      tags: [wishlist]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: The wishlist with price drops (never cached).
          content: { application/json: { schema: { $ref: "#/components/schemas/Wishlist" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/wishlist/ids:
    get:
      summary: Which products have I saved? (fills the hearts on cards)
      operationId: getWishlistIds
      tags: [wishlist]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: Saved product ids, newest first.
          content:
            application/json:
              schema: { type: object, required: [productIds], properties: { productIds: { type: array, items: { type: string, format: uuid } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/wishlist/{id}:
    put:
      summary: Save a product (the heart)
      description: |
        Remembers today's price, so a later drop shows as "Price drop". Saving again changes nothing
        and keeps the first saved price. At most 200 items.
      operationId: saveToWishlist
      tags: [wishlist]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Saved.
          content: { application/json: { schema: { $ref: "#/components/schemas/WishlistChange" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT. The wishlist is full (200 items).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Remove a product from the wishlist
      description: Works for any saved product, including unavailable ones. Removing twice is fine.
      operationId: removeFromWishlist
      tags: [wishlist]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Not saved.
          content: { application/json: { schema: { $ref: "#/components/schemas/WishlistChange" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }

  /api/v1/cart:
    get:
      summary: My cart, one package per store
      description: |
        Today's prices and stock for every line (stock is only held once an order is placed). Lines that
        need attention carry an `issue`; checkout needs `summary.canCheckout`. Never cached.
      operationId: getCart
      tags: [cart]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: The cart.
          content: { application/json: { schema: { type: object, required: [cart], properties: { cart: { $ref: "#/components/schemas/Cart" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/cart/preview:
    get:
      summary: A guest's cart (kept in the browser), shown with the same rules
      description: Nothing is saved. Repeated items are added together. At sign-in the browser sends the same list to `POST /cart/merge`.
      operationId: previewCart
      tags: [cart]
      parameters:
        - { name: items, in: query, required: true, description: "Comma-separated variantId:quantity pairs, at most 50.", schema: { type: string }, example: "0193c0de-0000-7000-8000-000000000001:2,0193c0de-0000-7000-8000-000000000002:1" }
      responses:
        "200":
          description: The cart as it would look.
          content: { application/json: { schema: { type: object, required: [cart], properties: { cart: { $ref: "#/components/schemas/Cart" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/cart/recommendations:
    get:
      summary: Recommended for you (the cart page)
      description: |
        Up to 5 products: best sellers from the cart's categories first ("Based on your cart"); signed in,
        then the wishlist's categories and followed stores; topped up with best sellers (signed in) or top
        rated (guests). Never what's in the cart, never sold out. Signed in, the account cart is used and
        `items` is ignored; a guest sends their browser cart. Never cached.
      operationId: cartRecommendations
      tags: [cart]
      security: [{}, { accessCookie: [] }]
      parameters:
        - { name: items, in: query, required: false, description: "Guests: the browser cart, as for /cart/preview.", schema: { type: string } }
      responses:
        "200":
          description: The recommendations.
          content: { application/json: { schema: { $ref: "#/components/schemas/Recommendations" } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/cart/items:
    post:
      summary: Add to cart
      description: Adds to the quantity already in the cart. The item must be for sale, with enough stock (at most 99 of one item, 50 different items).
      operationId: addToCart
      tags: [cart]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [variantId], properties: { variantId: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 99, default: 1 } } }
      responses:
        "200":
          description: The updated cart.
          content: { application/json: { schema: { type: object, required: [cart], properties: { cart: { $ref: "#/components/schemas/Cart" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT. Sold out, not enough left (`details.left`, `details.inCart`), more than 99, or the cart is full.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/cart/items/{variantId}:
    patch:
      summary: Change a line's quantity
      description: Also clears its "price changed" note (the shopper has now seen today's price).
      operationId: setCartQuantity
      tags: [cart]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [quantity], properties: { quantity: { type: integer, minimum: 1, maximum: 99 } } }
      responses:
        "200":
          description: The updated cart.
          content: { application/json: { schema: { type: object, required: [cart], properties: { cart: { $ref: "#/components/schemas/Cart" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT. Not enough left, or the item is no longer available (remove it).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Remove a line
      operationId: removeFromCart
      tags: [cart]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The updated cart (removing twice is fine).
          content: { application/json: { schema: { type: object, required: [cart], properties: { cart: { $ref: "#/components/schemas/Cart" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }

  /api/v1/cart/merge:
    post:
      summary: Merge a guest's browser cart into the account cart (at sign-in)
      description: |
        Quantities add up, capped by stock and 99. Items that can't be bought are skipped and reported,
        never an error, so signing in always works.
      operationId: mergeCart
      tags: [cart]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 50
                  items: { type: object, additionalProperties: false, required: [variantId, quantity], properties: { variantId: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 99 } } }
      responses:
        "200":
          description: The merged cart and what happened to each item.
          content: { application/json: { schema: { type: object, required: [cart, merge], properties: { cart: { $ref: "#/components/schemas/Cart" }, merge: { $ref: "#/components/schemas/CartMergeResult" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }

  /api/v1/addresses:
    get:
      summary: My saved addresses (default first)
      operationId: listAddresses
      tags: [addresses]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: Up to 10 addresses.
          content: { application/json: { schema: { type: object, required: [addresses], properties: { addresses: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Address" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Add an address
      description: The first address becomes the default automatically.
      operationId: createAddress
      tags: [addresses]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/AddressInput" }
                - { type: object, properties: { isDefault: { type: boolean } } }
      responses:
        "201":
          description: Saved.
          content: { application/json: { schema: { type: object, required: [address], properties: { address: { $ref: "#/components/schemas/Address" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "409":
          description: CONFLICT. Already 10 addresses.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/addresses/{id}:
    put:
      summary: Edit an address (the form sends every field)
      description: Past orders keep their own copy of the address, so they don't change.
      operationId: updateAddress
      tags: [addresses]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } }
      responses:
        "200":
          description: Saved.
          content: { application/json: { schema: { type: object, required: [address], properties: { address: { $ref: "#/components/schemas/Address" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete an address
      description: If it was the default, the newest remaining address becomes the default.
      operationId: deleteAddress
      tags: [addresses]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted.
          content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: boolean, const: true } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/addresses/{id}/default:
    post:
      summary: Set as default
      operationId: setDefaultAddress
      tags: [addresses]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Now the default.
          content: { application/json: { schema: { type: object, required: [address], properties: { address: { $ref: "#/components/schemas/Address" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/checkout/summary:
    post:
      summary: The checkout page (packages, delivery choices, address, payment methods, totals)
      description: Saves and reserves nothing. Send it again whenever the shopper changes a choice.
      operationId: checkoutSummary
      tags: [checkout]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                addressId: { type: string, format: uuid, description: Default address when left out. }
                delivery: { $ref: "#/components/schemas/DeliveryChoices" }
                paymentMethod: { type: string, enum: [GCASH, MAYA, CARD, COD] }
      responses:
        "200":
          description: The checkout page.
          content: { application/json: { schema: { $ref: "#/components/schemas/CheckoutSummary" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orders:
    get:
      summary: Your orders
      description: |
        Newest first, 10 per page. A tab shows the orders with at least one package in that state, so an
        order with one package shipped and one still to ship is in both. `counts` are for the tabs (not
        the search). Unpaid and cancelled orders are listed too (under All).
      operationId: listOrders
      tags: [checkout]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [all, to_ship, on_the_way, delivered], default: all } }
        - { name: q, in: query, description: "An order number (VD-21458, #VD-21458 or 21458) or words from a product's name. % and _ are plain text.", schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: One page of orders and the tab counts.
          content: { application/json: { schema: { $ref: "#/components/schemas/OrderList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Place order
      description: |
        Takes the stock (all or nothing) and copies prices, items and the address into the order.
        Online methods return `nextAction` with PayMongo's page; the order then waits up to 15 minutes
        for payment. Cash on delivery (up to ₱5,000, at most 2 open COD orders) is placed right away.
        The same `Idempotency-Key` always returns the same order (200 instead of 201).
      operationId: placeOrder
      tags: [checkout]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, description: "One per checkout, reused on retries: 8–64 letters, digits, - or _.", schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [addressId, paymentMethod, expectedTotalCentavos]
              properties:
                addressId: { type: string, format: uuid }
                delivery: { $ref: "#/components/schemas/DeliveryChoices" }
                paymentMethod: { type: string, enum: [GCASH, MAYA, CARD, COD] }
                expectedTotalCentavos: { type: integer, minimum: 0, description: The total the shopper saw. If it changed, nothing is ordered (409 total_changed). }
      responses:
        "201":
          description: Placed (COD) or waiting for payment (online).
          content: { application/json: { schema: { $ref: "#/components/schemas/PlacedOrder" } } }
        "200":
          description: Already placed with this Idempotency-Key; the same order.
          content: { application/json: { schema: { $ref: "#/components/schemas/PlacedOrder" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            CONFLICT, with `details.reason`: cart_empty, cart_issues, total_changed (+ `totalCentavos`),
            out_of_stock (+ `variantId`, `left`), cod_over_limit, cod_too_many.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: SERVICE_UNAVAILABLE. Online payment isn't available (PayMongo unreachable or not set up). Nothing was charged; the order was undone.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/orders/{id}:
    get:
      summary: One of my orders (waiting, failed and confirmation pages)
      description: |
        While it waits for an online payment, this also asks PayMongo (at most every 5 seconds per
        order), so the payment is confirmed when the shopper comes back even without the webhook.
        Poll it from the waiting page. An order past its window is cancelled here too.
      operationId: getOrder
      tags: [checkout]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The order.
          content: { application/json: { schema: { type: object, required: [order], properties: { order: { $ref: "#/components/schemas/Order" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/orders/{id}/payment:
    post:
      summary: Try paying again (same or another method)
      description: Within the 15 minutes. The previous PayMongo page is stopped first, so it can't also be paid. Switching to COD places the order right away (if eligible).
      operationId: retryPayment
      tags: [checkout]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [paymentMethod], properties: { paymentMethod: { type: string, enum: [GCASH, MAYA, CARD, COD] } } }
      responses:
        "200":
          description: The order, with PayMongo's new page for online methods.
          content: { application/json: { schema: { $ref: "#/components/schemas/PlacedOrder" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT, with `details.reason`; order_closed (window over), payment_in_progress, cod_over_limit, cod_too_many.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: SERVICE_UNAVAILABLE. PayMongo unreachable; try again.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/orders/{id}/cancel:
    post:
      summary: Cancel order (unpaid, or paid less than an hour ago)
      description: |
        Waiting for payment ("Back to cart"): cancelled and the stock returned. Paid (or cash on delivery) less than an
        hour ago (`canCancel`, `cancelUntil`): every package not shipped yet is cancelled, its stock returned and its
        items and delivery fee refunded through PayMongo (nothing to refund for cash on delivery); a package already
        shipped stays on its way. Each seller is emailed not to ship. After the hour, the seller can cancel it.
      operationId: cancelOrder
      tags: [checkout]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled.
          content: { application/json: { schema: { type: object, required: [order], properties: { order: { $ref: "#/components/schemas/Order" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            CONFLICT, with `details.reason`: payment_in_progress, cancel_window_over (paid more than an hour ago), already_shipped
            (nothing left to cancel), not_pending / not_cancellable (already cancelled or completed).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/orders/{id}/buy-again:
    post:
      summary: Buy again
      description: |
        The order's items go back into the cart with the same quantities (added to what's there), capped
        by stock and 99. Items that can't be bought any more are skipped and reported, never an error.
        Pressing it twice adds them twice.
      operationId: buyAgain
      tags: [checkout]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The cart, and what happened to each item.
          content: { application/json: { schema: { type: object, required: [cart, merge], properties: { cart: { $ref: "#/components/schemas/Cart" }, merge: { $ref: "#/components/schemas/CartMergeResult" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`not_paid`). The order is still waiting for payment; its items are still held for it.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/orders/{id}/packages/{packageId}/received:
    post:
      summary: Order received (one package)
      description: |
        The buyer confirms a shipped package arrived (sellers can't mark their own packages delivered). It
        becomes DELIVERED, the seller is credited (sale and Vendora's fee, available 7 days later), "Write a
        review" opens, and once no package is still on its way the order is COMPLETED (a cash-on-delivery
        payment then counts as paid). If the buyer doesn't confirm, it happens automatically 7 days after
        shipping (`autoConfirmAt`). Pressing it again, or after the automatic confirmation, changes nothing.
      operationId: confirmPackageReceived
      tags: [checkout]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: packageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The order after the change.
          content: { application/json: { schema: { type: object, required: [order], properties: { order: { $ref: "#/components/schemas/Order" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`not_shipped`). The seller hasn't shipped this package yet (or it was cancelled).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/webhooks/paymongo:
    post:
      summary: PayMongo → Vendora payment events
      description: |
        Not called by the frontend. Verified with the `Paymongo-Signature` header (HMAC-SHA256 of
        "<t>.<raw body>" with the webhook's secret, at most 5 minutes old) instead of cookies or a CSRF
        token. Each event is stored once; `checkout_session.payment.paid` confirms the order the same
        way as the shopper's return.
      operationId: paymongoWebhook
      tags: [checkout]
      parameters:
        - { name: Paymongo-Signature, in: header, required: true, schema: { type: string, example: "t=1496734173,te=1447a89e…,li=" } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          description: Received.
          content:
            application/json:
              schema: { type: object, required: [received, result], properties: { received: { type: boolean }, result: { type: string, enum: [processed, duplicate, ignored] } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: UNAUTHORIZED. Missing, wrong or old signature.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: SERVICE_UNAVAILABLE. Webhooks aren't set up (no PAYMONGO_WEBHOOK_SECRET).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/reviews:
    post:
      summary: Write a review
      description: |
        For one item from one of your orders, once its package is delivered; one review per item bought.
        Stars are required, the title and text are optional (empty = none). The product's and the store's
        ratings are recomputed in the same transaction. Product review pages are cached for up to 60 s.
      operationId: writeReview
      tags: [reviews]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderItemId, rating]
              properties:
                orderItemId: { type: string, format: uuid, description: "From the order page: packages[].items[].id." }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: [string, "null"], maxLength: 120 }
                body: { type: [string, "null"], maxLength: 2000 }
      responses:
        "201":
          description: Published.
          content: { application/json: { schema: { type: object, required: [review], properties: { review: { $ref: "#/components/schemas/MyReview" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT, with `details.reason`; not_delivered, already_reviewed.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/reviews/{id}:
    patch:
      summary: Edit your review
      description: Any time. Only the fields sent change (stars, title, text); the ratings are recomputed. A review hidden by moderation stays hidden.
      operationId: editReview
      tags: [reviews]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: [string, "null"], maxLength: 120 }
                body: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: Saved.
          content: { application/json: { schema: { type: object, required: [review], properties: { review: { $ref: "#/components/schemas/MyReview" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete your review
      description: Any time; the ratings are recomputed, and the item can be reviewed again.
      operationId: deleteReview
      tags: [reviews]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/store:
    get:
      summary: My store's onboarding (Seller Center)
      description: |
        Where the account is in "Open your store": two-step verification, the draft store, what's done and
        what's still `missing` before "Submit for review". The TIN and payout number are never sent back
        (only their last digits). Works for any signed-in account (`store` is null until step 1 is saved).
      operationId: getSellerStore
      tags: [seller]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: The onboarding state.
          content: { application/json: { schema: { $ref: "#/components/schemas/SellerOnboarding" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Step 1, store details (creates the draft store)
      description: |
        Needs two-step verification on (403 `two_factor_required`); admins can't open stores (403
        `admin_account`). The name makes the store's web address, so it's unique however it's written
        (409 `name_taken`), some names are reserved (409 `name_reserved`), and it can't change after
        submitting (409 `name_locked`). The category must be a top-level one.
      operationId: saveStoreDetails
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, category, shipsFrom]
              properties:
                name: { type: string, minLength: 3, maxLength: 40, example: SoundCraft Audio }
                category: { type: string, description: A top-level category's slug., example: electronics }
                description: { type: [string, "null"], maxLength: 1000 }
                shipsFrom: { type: string, minLength: 2, maxLength: 100, example: Manila }
      responses:
        "200": { $ref: "#/components/responses/SellerOnboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "409":
          description: CONFLICT, with `details.reason` and the `name` field; name_taken, name_reserved, name_locked.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/seller/store/logo:
    put:
      summary: Set the store logo (after uploading it with a ticket)
      description: The upload is checked with the storage service (in this account's folder, JPG/PNG/WebP, at most 5 MB); the link comes from the storage service.
      operationId: setStoreLogo
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UploadedFile" } } }
      responses:
        "200": { $ref: "#/components/responses/SellerOnboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/UploadsUnavailable" }
    delete:
      summary: Remove the store logo
      operationId: removeStoreLogo
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200": { $ref: "#/components/responses/SellerOnboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/store/verification:
    put:
      summary: Step 2, business verification
      description: |
        A TIN is required for everyone (stored encrypted). A registered business also needs its DTI or SEC
        registration number. Locked once submitted (409 `store_submitted`).
      operationId: saveStoreVerification
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [businessType, legalName, tin]
              properties:
                businessType: { type: string, enum: [INDIVIDUAL, REGISTERED_BUSINESS] }
                legalName: { type: string, minLength: 2, maxLength: 150, description: "Individual: full name as on the ID. Business: the registered business name." }
                registrationNo: { type: [string, "null"], description: "DTI or SEC registration number (registered businesses only).", example: DTI-3810-2219 }
                tin: { type: string, description: "9 digits plus a 3- or 5-digit branch code; spaces and dashes allowed.", example: 123-456-789-000 }
      responses:
        "200": { $ref: "#/components/responses/SellerOnboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`store_submitted`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/seller/store/documents:
    post:
      summary: Add a verification document (after uploading it with a ticket)
      description: |
        A private file: its type and size are read from the storage service. Individuals need a government
        ID; registered businesses also a DTI or SEC certificate. At most 10; locked once submitted.
      operationId: addStoreDocument
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, publicId]
              properties:
                type: { type: string, enum: [GOV_ID, DTI_CERT, SEC_CERT, BIR_2303] }
                publicId: { type: string, description: From the upload ticket. }
      responses:
        "200": { $ref: "#/components/responses/SellerOnboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT, with `details.reason`; store_submitted, too_many_documents, already_added.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/UploadsUnavailable" }

  /api/v1/seller/store/documents/{id}:
    delete:
      summary: Remove a verification document (and its file)
      operationId: removeStoreDocument
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/SellerOnboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`store_submitted`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/seller/store/payout-account:
    put:
      summary: Step 3, payout account (GCash or a listed bank)
      description: |
        The number is stored encrypted; only the last 4 digits come back. Once the store is submitted,
        CHANGING it needs "Confirm it's you" (403 `REAUTH_REQUIRED`), is recorded in security activity
        and emailed to the owner. A new account is verified again at review.
      operationId: setPayoutAccount
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [method, accountName, accountNumber]
                  properties:
                    method: { const: GCASH }
                    accountName: { type: string, minLength: 2, maxLength: 100 }
                    accountNumber: { type: string, description: A Philippine mobile number., example: 0917 123 4567 }
                - type: object
                  additionalProperties: false
                  required: [method, bankName, accountName, accountNumber]
                  properties:
                    method: { const: BANK }
                    bankName: { type: string, enum: [BDO Unibank, BPI, China Bank, EastWest Bank, GoTyme Bank, Landbank, Maya Bank, Metrobank, PNB, PSBank, RCBC, Security Bank, UnionBank] }
                    accountName: { type: string, minLength: 2, maxLength: 100 }
                    accountNumber: { type: string, description: 10–16 digits; spaces and dashes allowed. }
      responses:
        "200": { $ref: "#/components/responses/SellerOnboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN (`two_factor_required`, `admin_account`, `store_suspended`) or REAUTH_REQUIRED.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/store/submit:
    post:
      summary: Submit for review
      description: |
        Every step must be done (409 `incomplete`, with `details.missing`). The store becomes PENDING and the
        account a SELLER; an email confirms it. After an admin asked for changes (CHANGES_REQUESTED), this is
        "Submit again". A rejected application can't be submitted again (403 `store_rejected`). Refresh the session (`POST /auth/refresh`) to get the seller
        role in the access pass. Products can be added while it's reviewed; it appears to shoppers once
        approved. Sending it twice is harmless.
      operationId: submitStore
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200": { $ref: "#/components/responses/SellerOnboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`incomplete`, with `details.missing` as a comma-separated list).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/seller/uploads:
    post:
      summary: Get an upload ticket (the browser uploads straight to the storage service)
      description: |
        A one-time permission for ONE file at a place chosen by the server, in the allowed formats. POST the
        file to `url` as multipart/form-data with every entry of `fields` plus `file`, then send `publicId`
        to the logo or documents endpoint, or in a product's `photos`. A ticket can never replace a file
        that's already there. Logos and documents: at most 30 tickets an hour per account; product photos
        (sellers only, 403 `not_a_seller` otherwise): 120 an hour.
      operationId: createUploadTicket
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [purpose], properties: { purpose: { type: string, enum: [store_logo, store_document, product_photo] } } }
      responses:
        "200":
          description: The ticket.
          content: { application/json: { schema: { type: object, required: [upload], properties: { upload: { $ref: "#/components/schemas/UploadTicket" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "429":
          description: RATE_LIMITED. More than 30 tickets (120 for product photos) in an hour.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/UploadsUnavailable" }

  /api/v1/seller/products:
    get:
      summary: My products (Seller Center products list)
      description: |
        One row per variant (a draft without variants still gets a row), newest products first, 20 per page.
        The tabs split the rows: Active (published, in stock), Drafts, Out of stock (published, 0 left); All
        also has hidden ones (inactive, or removed by Vendora). `counts` are for the whole store. Needs a
        store submitted for review (403 `not_a_seller`).
      operationId: listSellerProducts
      tags: [seller]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [all, active, drafts, out_of_stock], default: all } }
        - { name: q, in: query, description: Search by name or SKU., schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, description: "Category slugs, repeatable (?category=a&category=b); a top-level one includes its sub-categories.", schema: { type: array, items: { type: string }, maxItems: 10 }, style: form, explode: true }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: A page of rows.
          content: { application/json: { schema: { $ref: "#/components/schemas/SellerProductList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
    post:
      summary: Add product (Save draft or Publish)
      description: |
        `intent: draft` needs only a title and a category. `intent: publish` also needs a description (20+
        characters), at least one photo and one variant; with `active: false` it's saved hidden. Shoppers see it
        once it's published, active and the store is approved. The category must be a sub-category. New photos
        are uploads with a `product_photo` ticket, checked with the storage service. An empty SKU is made up.
      operationId: createSellerProduct
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SellerProductInput" } } }
      responses:
        "201": { $ref: "#/components/responses/SellerProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "409": { $ref: "#/components/responses/SellerProductConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/UploadsUnavailable" }

  /api/v1/seller/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One of my products (the Edit product form)
      description: A deal that already ended shows as what shoppers pay now (the regular price, nothing crossed out).
      operationId: getSellerProduct
      tags: [seller]
      security: [{ accessCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/SellerProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Save the Edit product form
      description: |
        Send the whole form with the `version` it was loaded with; if the product changed since (another tab or
        person), it's refused (409 `stale`): reload. Existing variants send their `id` and `stockWas` (the stock
        the form showed): the change is added to what's there now, so units sold meanwhile still count (409
        `stock_changed` if it would go below 0). Variants and photos left out are removed; a variant that sold is
        hidden instead of deleted. A published product can't go back to draft (409 `already_published`).
      operationId: updateSellerProduct
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SellerProductInput" } } }
      responses:
        "200": { $ref: "#/components/responses/SellerProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SellerProductConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/UploadsUnavailable" }
    delete:
      summary: Delete a product that never sold
      description: A product with orders can't be deleted (409 `has_orders`); turn off Active to hide it instead. Its photos are deleted from storage.
      operationId: deleteSellerProduct
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Deleted.
          content: { application/json: { schema: { type: object, required: [id, deleted], properties: { id: { type: string, format: uuid }, deleted: { type: boolean, const: true } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SellerProductConflict" }

  /api/v1/seller/orders:
    get:
      summary: My orders (Seller Center orders list)
      description: |
        One row per package of this store, once it's paid (or placed with cash on delivery); unpaid orders
        aren't shown. "To ship" lists the most urgent first (earliest ship-by), the other tabs newest first,
        20 per page. `counts` are for the whole store, regardless of the search. `alerts` feeds "3 orders are
        due to ship today by 6:00 PM" (and how many are late). Customers appear as "Maria S." and their city.
      operationId: listSellerOrders
      tags: [seller]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [to_ship, shipped, delivered, all], default: to_ship } }
        - { name: q, in: query, description: 'Order number ("VD-21458", "21458") or words from a product name.', schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: A page of orders.
          content: { application/json: { schema: { $ref: "#/components/schemas/SellerOrderList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }

  /api/v1/seller/orders/export:
    get:
      summary: Export CSV
      description: |
        The orders of a tab (and search) as a CSV file, newest first, up to 5,000 rows. UTF-8 with a byte-order
        mark (for Excel); times in Philippine time; amounts in pesos. Buyers appear as "Maria S." and their city,
        never with their address or phone. Text that a spreadsheet would run as a formula (starting with = + - @)
        is written with a leading apostrophe.
      operationId: exportSellerOrders
      tags: [seller]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [to_ship, shipped, delivered, all], default: all } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: 'The file ("vendora-orders-2026-11-23.csv", as an attachment).'
          headers:
            Content-Disposition: { schema: { type: string }, example: attachment; filename=vendora-orders-2026-11-23.csv }
          content: { text/csv: { schema: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }

  /api/v1/seller/orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: The package (seller order) id from the list. }
    get:
      summary: One order (the seller's order page and packing slip)
      operationId: getSellerOrder
      tags: [seller]
      security: [{ accessCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/SellerOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/orders/{id}/shipment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Mark as shipped (or fix the shipping details)
      description: |
        "To ship" → SHIPPED with the courier and tracking number, and the buyer is emailed. Sending it again
        (a double click) changes nothing; sending different details while it's on its way corrects them (the
        buyer gets the new ones). The tracking number is kept as letters and digits only ("7720 1934-5512" →
        "772019345512") and is unique per courier. A suspended store can still ship orders already paid.
      operationId: shipSellerOrder
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ShipmentInput" } } }
      responses:
        "200": { $ref: "#/components/responses/SellerOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            CONFLICT, with `details.reason`: tracking_in_use (another package has this courier's tracking number;
            a `trackingNumber` field error), already_delivered, cancelled.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/seller/orders/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Cancel order (still to ship), with a reason
      description: |
        The package is cancelled; its stock goes back (OUT_OF_STOCK sets the variants to 0 instead: the seller just
        said they aren't there); the buyer is refunded its items and delivery fee through PayMongo (cash on delivery:
        the courier collects less) and emailed why. Sending it again changes nothing. A suspended store can still
        cancel. Recorded with who and why (no automatic penalty). Packages not shipped 3 days after ship-by are
        cancelled automatically (`autoCancelAt`).
      operationId: cancelSellerOrder
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SellerCancelInput" } } }
      responses:
        "200": { $ref: "#/components/responses/SellerOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`already_shipped`). It has shipped; it can't be cancelled.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/seller/dashboard:
    get:
      summary: Dashboard (last 7 or 30 days)
      description: |
        Sales (items in paid packages, before Vendora's fee; cancelled ones left out), orders (and how many are to
        ship today), store visits and rating, each against the period before; sales per Philippine day; the 5 latest
        orders; and what needs attention now. Store visits are unique visitors per store per day (store page and its
        product pages), counted without cookies or personal data.
      operationId: getSellerDashboard
      tags: [seller]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d], default: 7d } }
      responses:
        "200":
          description: The dashboard.
          content: { application/json: { schema: { $ref: "#/components/schemas/SellerDashboard" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }

  /api/v1/seller/payouts:
    get:
      summary: Payouts (balance, payout account, history)
      description: |
        Available now (released 7 days after delivery, not paid out yet), waiting (on hold, plus paid orders not delivered
        yet, what the seller will get from them), paid out this month, the payout account, the next automatic payout
        (every Monday 9:00 AM Manila) and the history, newest first, 20 a page.
      operationId: getSellerPayouts
      tags: [seller]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: The payouts page.
          content: { application/json: { schema: { $ref: "#/components/schemas/SellerPayouts" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
    post:
      summary: Request payout
      description: |
        Pays out everything available now (at least ₱100) to the verified payout account: the lines are linked to the
        payout in one transaction with the store locked, so nothing is paid twice, and one payout can be in progress at a
        time. The seller is emailed. The transfer is simulated until milestone 7.
      operationId: requestPayout
      tags: [seller]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "201":
          description: The payouts page, with the new payout first.
          content: { application/json: { schema: { $ref: "#/components/schemas/SellerPayouts" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }
        "409":
          description: 'CONFLICT, with `details.reason`: below_minimum, in_progress, no_account, account_not_verified, store_not_approved.'
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/seller/payouts/statement:
    get:
      summary: Download statements (one month)
      description: Every ledger line of one Philippine calendar month as CSV (sales, fees, payouts, adjustments; amounts in pesos, negative for money out).
      operationId: downloadStatement
      tags: [seller]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$" }, example: 2026-11 }
      responses:
        "200":
          description: 'The file ("vendora-statement-2026-11.csv", as an attachment).'
          headers:
            Content-Disposition: { schema: { type: string }, example: attachment; filename=vendora-statement-2026-11.csv }
          content: { text/csv: { schema: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SellerForbidden" }

  /api/v1/admin/dashboard:
    get:
      summary: Admin dashboard (any admin role)
      description: Sales (GMV) and orders this month against the same days of last month, what's waiting for an admin, orders per day for 14 days, and the first items of the queues.
      operationId: getAdminDashboard
      tags: [admin]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: The dashboard.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminDashboard" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/applications:
    get:
      summary: Seller applications (Support)
      description: Waiting for review oldest first; the other tabs newest first; 20 a page. Search by store name, web address or the owner's email. `counts` ignore the search.
      operationId: listApplications
      tags: [admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [pending, changes_requested, rejected, approved], default: pending } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: A page of applications.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/applications/{storeId}:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One application (Support)
      description: The store, the owner, the business details (TIN masked), the documents (no links), the payout account, the checks and the history from the audit log.
      operationId: getApplication
      tags: [admin]
      security: [{ accessCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/applications/{storeId}/tin:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Show the full TIN (Support, audit-logged)
      operationId: revealTin
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: The TIN.
          content: { application/json: { schema: { type: object, required: [tin], properties: { tin: { type: string, example: 123-456-789-000 } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/applications/{storeId}/documents/{documentId}/link:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Open a private document (Support, audit-logged)
      description: A Cloudinary link to the private (authenticated) file that works for 5 minutes. Open it right away; don't store it.
      operationId: documentLink
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: The link.
          content: { application/json: { schema: { type: object, required: [url, expiresAt], properties: { url: { type: string }, expiresAt: { type: string, format: date-time } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/UploadsUnavailable" }

  /api/v1/admin/applications/{storeId}/approve:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Approve seller (Support, Confirm it's you)
      description: |
        Only a waiting application. The store goes live for shoppers, its documents count as checked and its payout
        account as verified (so it needs "Confirm it's you": 403 REAUTH_REQUIRED). The seller is emailed, with the
        optional note.
      operationId: approveApplication
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { note: { type: string, maxLength: 1000 } } } } }
      responses:
        "200": { $ref: "#/components/responses/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ApplicationConflict" }

  /api/v1/admin/applications/{storeId}/request-changes:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Ask for changes (Support)
      description: Only a waiting application. It goes back to the seller (CHANGES_REQUESTED) with the note, emailed; they can edit their details and documents and submit again.
      operationId: requestApplicationChanges
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewNote" } } }
      responses:
        "200": { $ref: "#/components/responses/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ApplicationConflict" }

  /api/v1/admin/applications/{storeId}/reject:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Reject (Support, final)
      description: Only a waiting application. Final; the seller is emailed the note and can't submit again.
      operationId: rejectApplication
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewNote" } } }
      responses:
        "200": { $ref: "#/components/responses/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ApplicationConflict" }

  /api/v1/admin/payout-accounts:
    get:
      summary: Payout accounts to check (Support)
      description: Accounts changed by sellers whose stores were already approved, oldest first. Their payouts wait until an admin verifies them.
      operationId: listPayoutAccountsToCheck
      tags: [admin]
      security: [{ accessCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/PayoutAccountsToCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/payout-accounts/{storeId}/number:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Show the full account number (Support, audit-logged)
      operationId: revealPayoutAccountNumber
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: The number.
          content: { application/json: { schema: { type: object, required: [accountNumber], properties: { accountNumber: { type: string } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/payout-accounts/{storeId}/verify:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Verify a payout account (Support, Confirm it's you)
      description: Payouts go to this account from now on; the seller is emailed. If the seller changed it again meanwhile, it's refused (409 `changed`).
      operationId: verifyPayoutAccount
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200": { $ref: "#/components/responses/PayoutAccountsToCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'CONFLICT, with `details.reason`: already_verified, changed.'
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/admin/users:
    get:
      summary: Users (Support)
      description: Newest first, 20 a page. Tabs by role, plus locked (after wrong passwords; locks end by themselves in 15 minutes, there's no unlock) or suspended. Search by name or email. `counts` ignore the search.
      operationId: listUsers
      tags: [admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [all, customers, sellers, admins, locked_suspended], default: all } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: A page of accounts.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/users/export:
    post:
      summary: Export the list as CSV (Support, logged)
      description: The tab and search's accounts (up to 5,000), only the list's columns; formula-safe cells. A POST because each export is written to the audit log.
      operationId: exportUsers
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tab: { type: string, enum: [all, customers, sellers, admins, locked_suspended], default: all }
                q: { type: string, maxLength: 100 }
      responses:
        "200":
          description: "vendora-users-<tab>-<date>.csv: Name, Email, Role, Two-step, Orders, Joined (PH time), Status."
          content: { text/csv: { schema: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One account (Support)
      operationId: getUser
      tags: [admin]
      security: [{ accessCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/users/{userId}/suspend:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Suspend an account (Support, Confirm it's you)
      description: |
        At once, even in an open session: sign-in refused (ACCOUNT_SUSPENDED), every sign-in ended and its access
        passes refused. A seller's live store is suspended with it (hidden; paid orders they can't ship are cancelled
        and refunded after the ship-by deadline). An open 2FA-reset link is cancelled. The person is emailed the reason.
        Admin accounts can't be suspended here (403 `admin_target`).
      operationId: suspendUser
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 10, maxLength: 500 } } }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`already_suspended`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/admin/users/{userId}/reactivate:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Reactivate an account (Support, Confirm it's you)
      description: The account, and the store if the suspension took it down (a store Support suspended on its own stays suspended). The person is emailed.
      operationId: reactivateUser
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`not_suspended`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/admin/users/{userId}/two-factor-reset:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Start a reset of two-step verification (Support, Confirm it's you)
      description: |
        For someone who lost their authenticator app and backup codes. Support writes how they checked who the person
        is; the owner gets a link (24 hours, once) and nothing changes until they open it (POST /auth/two-factor-reset).
        A newer request cancels older ones.
      operationId: requestTwoFactorReset
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [identityCheck], properties: { identityCheck: { type: string, minLength: 10, maxLength: 500, example: Matched a selfie with the ID on file (video call). } } }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'CONFLICT, with `details.reason`: two_factor_off, suspended.'
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/admin/stores:
    get:
      summary: Stores (Support)
      description: Live and suspended stores (applications are on Seller approvals), newest approval first, 20 a page. Search by store name or address, or the owner's name or email.
      operationId: listStores
      tags: [admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [live, suspended, all], default: all } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: A page of stores.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminStoreList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/stores/{storeId}:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One store (Support)
      operationId: getAdminStore
      tags: [admin]
      security: [{ accessCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminStore" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/stores/{storeId}/suspend:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Suspend a store (Support, Confirm it's you)
      description: Hidden from shoppers; the seller can't change anything and isn't paid out, but still ships orders already paid. The seller is emailed the reason and sees it in Seller Center.
      operationId: suspendStore
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 10, maxLength: 500 } } }
      responses:
        "200": { $ref: "#/components/responses/AdminStore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT (`not_live`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/admin/stores/{storeId}/reactivate:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Reactivate a store (Support, Confirm it's you)
      description: A store Support (or warnings) suspended. One that went down with its owner's account comes back by reactivating the account (409 `suspended_with_account`).
      operationId: reactivateStore
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminStore" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'CONFLICT, with `details.reason`: not_suspended, suspended_with_account.'
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/admin/stores/{storeId}/rename:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Rename a store (Support, Confirm it's you)
      description: |
        The same name rules sellers have (3–40 characters; unique however it's written; reserved words refused). The
        old address redirects to the store forever and stays reserved; renaming back to an old name takes it back. The
        seller is emailed.
      operationId: renameStore
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 3, maxLength: 40 } } }
      responses:
        "200": { $ref: "#/components/responses/AdminStore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'CONFLICT, with `details.reason` (and field `name`): name_taken (also an old address of another store), name_reserved, same_name.'
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/admin/audit:
    get:
      summary: The audit log (every admin)
      description: |
        Every admin action and every look at sensitive data, newest first, 50 a page, each in plain words (`summary`) with
        who, when and from which IP. Filters: area, admin (`actor`), one record (`target`), Philippine dates (inclusive).
        `admins` lists every admin for the filter. Read-only.
      operationId: listAuditLog
      tags: [admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: area, in: query, schema: { type: string, enum: [stores, users, payouts, refunds, admins] } }
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: target, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date, example: 2026-11-27 } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: A page of the audit log.
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditLogPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/payouts:
    get:
      summary: Payouts (Finance)
      description: In progress oldest first (the ones to transfer); failed and paid newest first; 20 a page. Search by the payout's reference or the store's name. `counts` ignore the search; `inProgressCentavos` is everything still to transfer.
      operationId: listPayouts
      tags: [admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [in_progress, failed, paid], default: in_progress } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: A page of payouts.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminPayoutList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/payouts/{payoutId}/account:
    parameters:
      - { name: payoutId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Show the account to transfer to (Finance, logged)
      description: The seller's full GCash or bank number for an in-progress payout; each look is in the audit log. Never an account the seller changed after the payout was made (409 `account_changed`; mark the payout failed instead).
      operationId: showPayoutAccount
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Where to send the money.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    type: object
                    properties:
                      method: { type: string, enum: [GCASH, BANK] }
                      bankName: { type: [string, "null"] }
                      accountName: { type: string }
                      accountNumber: { type: string, example: "+639171234567" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'CONFLICT, with `details.reason`: not_processing (already paid or failed), account_changed.'
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/admin/payouts/{payoutId}/paid:
    parameters:
      - { name: payoutId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Mark a payout paid (Finance, Confirm it's you)
      description: After the transfer, with its reference (shown to the seller, who is emailed). Only while it's in progress, checked in the same statement as the change, so two admins can't both mark it.
      operationId: markPayoutPaid
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transferReference]
              properties:
                transferReference: { type: string, minLength: 4, maxLength: 100, pattern: "^[A-Za-z0-9][A-Za-z0-9 ./#-]*$", example: GCASH 9012 3456 7890 }
      responses:
        "200": { $ref: "#/components/responses/AdminPayout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PayoutNotProcessing" }

  /api/v1/admin/payouts/{payoutId}/failed:
    parameters:
      - { name: payoutId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Mark a payout failed (Finance, Confirm it's you)
      description: The transfer didn't go through. Its money is back in the seller's balance for the next payout (a new ledger line; history is never edited); the seller is emailed the reason.
      operationId: markPayoutFailed
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 255, example: The GCash account is closed }
      responses:
        "200": { $ref: "#/components/responses/AdminPayout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PayoutNotProcessing" }

  /api/v1/admin/refunds:
    get:
      summary: Refunds (Finance)
      description: Needing a person (PayMongo refused them for 3 days, or showed a refund we never recorded) oldest first; retrying (hourly) next try first; sent newest first; 20 a page. Search by order number (VD-21458) or the buyer's email.
      operationId: listRefunds
      tags: [admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [needs_person, retrying, sent], default: needs_person } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
      responses:
        "200":
          description: A page of refunds.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminRefundList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/refunds/{refundId}/retry:
    parameters:
      - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Try a refund again now (Finance, Confirm it's you)
      description: |
        One try right away. First PayMongo's own list of the payment's refunds is checked: one we never recorded
        (e.g. made in PayMongo's dashboard) refuses it (409 `unrecorded_refund`), so the buyer can't be refunded
        twice. A refund the job is trying at this moment is left alone (409 `busy`). `result`: sent, or
        still_failing (a refund that needed a person goes back there, without a second email to the buyer).
      operationId: retryRefund
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: How the try went, and the refund now.
          content:
            application/json:
              schema:
                type: object
                required: [result, refund]
                properties:
                  result: { type: string, enum: [sent, still_failing] }
                  refund: { $ref: "#/components/schemas/AdminRefund" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'CONFLICT, with `details.reason`: already_sent, busy, changed, unrecorded_refund.'
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/admin/refunds/{refundId}/refunded:
    parameters:
      - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Mark a refund as refunded by hand (Finance, Confirm it's you)
      description: |
        For a refund that needs a person. Either the id of a refund made in PayMongo's dashboard (checked with
        PayMongo: on this order's payment, the same amount, not failed, not recorded for another refund; a
        problem is a 400 on `providerRefundId`), or another transfer (e.g. GCash) with its reference. The buyer
        gets the email the "refund delayed" one promised; the change and its audit row are one transaction.
      operationId: markRefunded
      tags: [admin]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [via, providerRefundId]
                  properties:
                    via: { const: PAYMONGO_DASHBOARD }
                    providerRefundId: { type: string, pattern: "^ref_[A-Za-z0-9_]{6,60}$" }
                - type: object
                  additionalProperties: false
                  required: [via, reference]
                  properties:
                    via: { const: OTHER_TRANSFER }
                    reference: { type: string, minLength: 4, maxLength: 100, example: GCASH 9012 3456 7890 }
                    note: { type: string, maxLength: 255, description: For the audit log only. }
      responses:
        "200":
          description: The refund, now sent.
          content: { application/json: { schema: { type: object, required: [refund], properties: { refund: { $ref: "#/components/schemas/AdminRefund" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'CONFLICT, with `details.reason`: already_sent, not_failed (still being retried, or changed meanwhile).'
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/notifications/preferences:
    get:
      summary: My email settings
      operationId: getEmailPreferences
      tags: [notifications]
      security: [{ accessCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmailPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Change my email settings
      operationId: setEmailPreferences
      tags: [notifications]
      security: [{ accessCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EmailPreferences" } } }
      responses:
        "200": { $ref: "#/components/responses/EmailPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/notifications/unsubscribe:
    post:
      summary: One-click unsubscribe from price-drop emails
      description: |
        The link in every price-drop email (and its List-Unsubscribe header, which mail apps POST to themselves,
        RFC 8058). No sign-in and no CSRF token: the signed `token` is the proof. Doing it twice is fine.
      operationId: unsubscribePriceDrops
      tags: [notifications]
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, example: "0193c0de-…-…-…-….9f86d0…" } }
      responses:
        "200":
          description: Price-drop emails are off.
          content: { application/json: { schema: { type: object, required: [priceDrops], properties: { priceDrops: { type: boolean, const: false } } } } }
        "400":
          description: VALIDATION_ERROR. The link isn't valid.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/stores/{slug}:
    get:
      summary: The store page (header, About, category chips)
      description: |
        Approved stores only. The product grid is the normal search with `store=<slug>` (and `deal=true`
        for the "Deals" chip). The page is the same for everyone and cacheable; whether the signed-in
        shopper follows the store comes from `GET /stores/{slug}/follow`.
      operationId: getStore
      tags: [stores]
      parameters:
        - $ref: "#/components/parameters/StoreSlug"
      responses:
        "200":
          description: Everything the store page header and About tab show.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { type: object, required: [store], properties: { store: { $ref: "#/components/schemas/StorePage" } } }
        "301":
          description: An old address of a store Vendora renamed (7c-2); `Location` is the store's current address (old addresses redirect forever).
          headers: { Location: { schema: { type: string, example: /api/v1/stores/kalye-sound } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stores/{slug}/reviews:
    get:
      summary: A store's reviews (store Reviews tab)
      description: |
        Reviews of all the store's products except products removed by moderation, the same set as the
        store's rating. Each review names its product; `product.available` is false when that product's
        page can't be opened any more (e.g. the seller stopped selling it).
      operationId: listStoreReviews
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/StoreSlug"
        - $ref: "#/components/parameters/ReviewRating"
        - $ref: "#/components/parameters/ReviewSort"
        - $ref: "#/components/parameters/ReviewPage"
      responses:
        "200":
          description: The rating summary and one page of reviews (10 per page).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stores/{slug}/follow:
    get:
      summary: Do I follow this store?
      operationId: getFollowState
      tags: [stores]
      security: [{ accessCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreSlug"
      responses:
        "200":
          description: Follow state for the signed-in shopper (never cached).
          content: { application/json: { schema: { $ref: "#/components/schemas/FollowState" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Follow a store
      description: Idempotent. Following twice, or several clicks at once, counts the shopper once.
      operationId: followStore
      tags: [stores]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreSlug"
      responses:
        "200":
          description: Now following.
          content: { application/json: { schema: { $ref: "#/components/schemas/FollowState" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: CONFLICT. It's your own store.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Unfollow a store
      description: Idempotent. Works even if the store is no longer approved, so nobody gets stuck following it.
      operationId: unfollowStore
      tags: [stores]
      security: [{ accessCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreSlug"
      responses:
        "200":
          description: Not following.
          content: { application/json: { schema: { $ref: "#/components/schemas/FollowState" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CsrfInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/auth/me:
    get:
      summary: Who is signed in?
      operationId: getMe
      tags: [auth]
      security: [{ accessCookie: [] }]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: UNAUTHORIZED. Not signed in, or the access pass expired (call refresh).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: vd_at
      description: 15-minute access pass (JWT, httpOnly). `__Host-vd_at` in production.
    refreshCookie:
      type: apiKey
      in: cookie
      name: vd_rt
      description: Refresh pass (httpOnly, sent only to /api/v1/auth). `__Secure-vd_rt` in production.
    challengeCookie:
      type: apiKey
      in: cookie
      name: vd_2fa
      description: The "enter your code" / "set up 2FA" step after a correct password (httpOnly, minutes, /api/v1/auth only). `__Secure-vd_2fa` in production.
    trustedDeviceCookie:
      type: apiKey
      in: cookie
      name: vd_td
      description: '"Trust this device for 30 days" (httpOnly, /api/v1/auth only). `__Secure-vd_td` in production.'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on every POST/PUT/PATCH/DELETE. Get it from GET /api/v1/auth/csrf.

  headers:
    X-Request-Id:
      description: |
        ID of this request, also written to the server logs. A client may send its own
        (letters, digits, "-" and "_", max 64 chars); anything else is replaced.
      schema: { type: string, maxLength: 64 }

  schemas:
    Health:
      type: object
      required: [status, uptimeSeconds]
      properties:
        status: { type: string, const: ok }
        uptimeSeconds: { type: number }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, error, not_configured]

    Error:
      description: |
        Every error uses this shape. Messages are safe to show to users; stack traces and
        internal details are never sent (they are logged with the same requestId).
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - INVALID_JSON
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
                - CSRF_INVALID
                - INVALID_CREDENTIALS
                - ACCOUNT_LOCKED
                - ACCOUNT_SUSPENDED
                - EMAIL_NOT_VERIFIED
                - INVALID_CODE
                - INVALID_LINK
                - CHALLENGE_EXPIRED
                - REAUTH_REQUIRED
            message: { type: string }
            requestId: { type: string }
            details:
              description: Extra facts the screen needs, e.g. attemptsLeft or retryAfterSeconds.
              type: object
              additionalProperties: true
            fields:
              description: Only for VALIDATION_ERROR — which input fields were wrong and why.
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string, example: "email" }
                  message: { type: string, example: "Enter a valid email address" }
      example:
        error: { code: NOT_FOUND, message: "Route not found", requestId: "5f0c2a1e-8c7d-4b7e-9d1f-2a3b4c5d6e7f" }

    User:
      type: object
      required: [id, email, name, role, emailVerified, twoFactorEnabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [CUSTOMER, SELLER, ADMIN] }
        emailVerified: { type: boolean }
        twoFactorEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: { type: string, description: Send it in the X-CSRF-Token header. }

    SignedIn:
      type: object
      required: [user, csrfToken]
      properties:
        status: { type: string, const: signed_in }
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string, description: The new CSRF token for the signed-in browser. }

    TwoFactorStep:
      description: The password was right; one more step before signing in. The step is kept in the vd_2fa cookie.
      type: object
      required: [status, expiresInSeconds]
      properties:
        status:
          type: string
          enum: [two_factor_required, two_factor_setup_required, google_link_required]
          description: "two_factor_required: show 'Enter the 6-digit code'. two_factor_setup_required: sellers/admins must set up 2FA first."
        expiresInSeconds: { type: integer, example: 300 }

    TwoFactorVerifyRequest:
      type: object
      properties:
        code: { type: string, pattern: "^[0-9]{6}$", description: "From the authenticator app. Send this OR backupCode." }
        backupCode: { type: string, example: kq7mz-4hx2p }
        trustDevice: { type: boolean, default: false, description: "Trust this device for 30 days" }

    SecondFactorRequest:
      type: object
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        backupCode: { type: string, example: kq7mz-4hx2p }

    AppCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    TwoFactorStatus:
      type: object
      required: [enabled, enabledAt, required, backupCodesLeft]
      properties:
        enabled: { type: boolean }
        enabledAt: { type: [string, "null"], format: date-time }
        required: { type: boolean, description: True for sellers and admins. }
        backupCodesLeft: { type: integer, example: 7 }

    TwoFactorSetup:
      type: object
      required: [otpauthUri, manualKey]
      properties:
        otpauthUri: { type: string, example: "otpauth://totp/Vendora:maria%40example.com?issuer=Vendora&secret=…" }
        manualKey: { type: string, example: "JBSW Y3DP EHPK 3PXP …" }

    BackupCodes:
      type: object
      required: [backupCodes]
      properties:
        backupCodes: { type: array, minItems: 10, maxItems: 10, items: { type: string, example: kq7mz-4hx2p } }

    SecurityOverview:
      type: object
      required: [email, emailVerified, hasPassword, passwordChangedAt, accountCreatedAt, twoFactor, confirmMethod, google]
      properties:
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        hasPassword: { type: boolean, description: False for Google-only accounts. }
        passwordChangedAt: { type: [string, "null"], format: date-time, description: "null = never changed (show accountCreatedAt)." }
        accountCreatedAt: { type: string, format: date-time }
        twoFactor: { $ref: "#/components/schemas/TwoFactorStatus" }
        confirmMethod: { type: string, enum: [app, password, email] }
        google:
          type: object
          required: [connected, email]
          properties:
            connected: { type: boolean }
            email: { type: [string, "null"], format: email, description: '"Connected as …"' }

    ConfirmStatus:
      type: object
      required: [method, confirmed, expiresInSeconds]
      properties:
        method: { type: string, enum: [app, password, email], description: "app: authenticator code; password; email: send-code first." }
        confirmed: { type: boolean }
        expiresInSeconds: { type: integer, description: Seconds left of the last confirmation (0 if none). }

    ConfirmRequest:
      type: object
      description: Send code OR password.
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        password: { type: string, maxLength: 128 }

    CodeSent:
      type: object
      required: [status, email, expiresInSeconds]
      properties:
        status: { type: string, const: code_sent }
        email: { type: string, description: "Masked, e.g. maria.s•••@gmail.com" }
        expiresInSeconds: { type: integer, example: 600 }

    DeviceSession:
      type: object
      required: [id, device, deviceType, location, signedInAt, lastActiveAt, current]
      properties:
        id: { type: string, format: uuid }
        device: { type: string, example: Chrome on Windows }
        deviceType: { type: string, enum: [desktop, mobile, tablet, unknown] }
        location: { type: [string, "null"], example: "Manila, PH", description: From the hosting provider's location headers; null locally. }
        signedInAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        current: { type: boolean, description: '"This device"' }

    SecurityEvent:
      type: object
      required: [id, type, device, deviceType, location, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [LOGIN_OK, LOCKED, LOGOUT_ALL, PASSWORD_CHANGED, PASSWORD_RESET, EMAIL_CHANGED, TWO_FA_ENABLED, TWO_FA_DISABLED, BACKUP_CODE_USED, BACKUP_CODES_RENEWED, SESSION_REVOKED, TOKEN_REUSE_DETECTED, GOOGLE_CONNECTED, GOOGLE_DISCONNECTED, PAYOUT_ACCOUNT_CHANGED]
        device: { type: string, example: Safari on iPhone }
        deviceType: { type: string, enum: [desktop, mobile, tablet, unknown] }
        location: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    ChangeEmailRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail: { type: string, format: email, maxLength: 254 }

    CategoryNode:
      type: object
      required: [id, slug, name, productCount, children]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: headphones }
        name: { type: string, example: Headphones }
        productCount: { type: integer, description: Visible products here and in sub-categories. }
        children: { type: array, items: { $ref: "#/components/schemas/CategoryNode" } }

    ProductCard:
      type: object
      required: [id, slug, title, store, image, priceCentavos, compareAtCentavos, savingsPercent, saleEndsAt, ratingAvg, ratingCount, soldCount, inStock, stockLeft, freeDelivery, badges]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        store: { type: object, required: [name, slug], properties: { name: { type: string }, slug: { type: string } } }
        image: { type: [object, "null"], properties: { url: { type: string }, alt: { type: [string, "null"] } } }
        priceCentavos: { type: integer, example: 749900, description: The cheapest variant after deal rules ("from"). }
        compareAtCentavos: { type: [integer, "null"], example: 999900, description: Crossed-out price while a deal is on. }
        savingsPercent: { type: integer, example: 25 }
        saleEndsAt: { type: [string, "null"], format: date-time, description: Deal countdown end. }
        ratingAvg: { type: number, example: 4.8 }
        ratingCount: { type: integer }
        soldCount: { type: integer }
        inStock: { type: boolean }
        stockLeft: { type: [integer, "null"], minimum: 1, maximum: 5, description: "Only 3 left: units left across the variants on sale, only when 1 to 5 (exact stock stays private)." }
        freeDelivery: { type: boolean, description: Reaches the ₱999 free-delivery minimum on its own. }
        badges:
          type: object
          required: [deal, bestseller, new]
          properties: { deal: { type: boolean }, bestseller: { type: boolean }, new: { type: boolean } }

    CategoryFacet:
      type: object
      required: [slug, name, count, children]
      properties:
        slug: { type: string }
        name: { type: string }
        count: { type: integer }
        children: { type: array, items: { $ref: "#/components/schemas/CategoryFacet" } }

    SearchResult:
      type: object
      required: [query, matchMode, items, page, pageSize, totalItems, totalPages, sellerCount, facets]
      properties:
        query: { type: [string, "null"] }
        matchMode: { type: string, enum: [words, similar], description: '"similar": no exact matches, showing similar spellings.' }
        items: { type: array, items: { $ref: "#/components/schemas/ProductCard" } }
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer, example: 1248 }
        totalPages: { type: integer, maximum: 50 }
        sellerCount: { type: integer, example: 214, description: '"1,248 results from 214 verified sellers"' }
        facets:
          type: object
          required: [categories, stores, price]
          properties:
            categories: { type: array, items: { $ref: "#/components/schemas/CategoryFacet" } }
            stores:
              type: object
              required: [items, total]
              properties:
                items: { type: array, items: { type: object, required: [slug, name, count], properties: { slug: { type: string }, name: { type: string }, count: { type: integer } } } }
                total: { type: integer, description: '"+ Show N more"' }
            price:
              type: object
              required: [minCentavos, maxCentavos]
              properties: { minCentavos: { type: [integer, "null"] }, maxCentavos: { type: [integer, "null"] } }

    ProductDetail:
      type: object
      required: [id, slug, title, description, specs, category, breadcrumbs, store, images, variants, price, rating, soldCount, inStock, delivery, returns]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        specs: { type: array, items: { type: object, required: [label, value], properties: { label: { type: string, example: Battery life }, value: { type: string, example: 30 hours } } } }
        category: { type: object, properties: { slug: { type: string }, name: { type: string } } }
        breadcrumbs: { type: array, items: { type: object, properties: { slug: { type: string }, name: { type: string } } } }
        store:
          type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            logoUrl: { type: [string, "null"] }
            ratingAvg: { type: number }
            ratingCount: { type: integer }
            positivePercent: { type: [integer, "null"], example: 98, description: Share of 4★ and 5★ reviews in the last 12 months. }
            followerCount: { type: integer }
            shipsFrom: { type: [string, "null"] }
            verified: { type: boolean }
            sellingSince: { type: integer, example: 2023 }
        images: { type: array, items: { type: object, properties: { url: { type: string }, alt: { type: string } } } }
        variantLabel: { type: string, example: Color, description: 'What the variants differ by: "Color: Midnight Black", "Size: XL". With one variant there is nothing to pick.' }
        variants:
          type: array
          items:
            type: object
            required: [id, sku, name, priceCentavos, compareAtCentavos, saleEndsAt, savingsCentavos, savingsPercent, stock]
            properties:
              id: { type: string, format: uuid }
              sku: { type: string }
              name: { type: string, example: Midnight Black }
              priceCentavos: { type: integer }
              compareAtCentavos: { type: [integer, "null"] }
              saleEndsAt: { type: [string, "null"], format: date-time }
              savingsCentavos: { type: integer }
              savingsPercent: { type: integer }
              stock:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [in_stock, low_stock, out_of_stock] }
                  left: { type: integer, description: Only for low_stock ("Only 3 left"). Exact stock is never shown otherwise. }
        price:
          type: object
          properties:
            fromCentavos: { type: integer }
            toCentavos: { type: integer }
            compareAtCentavos: { type: [integer, "null"] }
            savingsPercent: { type: integer }
            dealEndsAt: { type: [string, "null"], format: date-time, description: '"Deal ends in 08:42:19"' }
        rating: { type: object, properties: { avg: { type: number }, count: { type: integer } } }
        soldCount: { type: integer }
        inStock: { type: boolean }
        delivery:
          type: object
          properties:
            freeThresholdCentavos: { type: integer, example: 99900 }
            qualifiesForFreeDelivery: { type: boolean }
            standardFeeCentavos: { type: integer, example: 4900 }
            expressFeeCentavos: { type: integer, example: 12900 }
            expressAvailable: { type: boolean, description: "The seller's \"Offer Express delivery\" for this product." }
            standardDays: { type: object, properties: { min: { type: integer }, max: { type: integer } } }
            expressDays: { type: object, properties: { min: { type: integer }, max: { type: integer } } }
        returns: { type: object, properties: { days: { type: integer, example: 30 } } }

    TopStore:
      type: object
      required: [slug, name, logoUrl, mainCategory, rating, positivePercent, followerCount]
      properties:
        slug: { type: string }
        name: { type: string }
        logoUrl: { type: [string, "null"] }
        mainCategory: { type: [object, "null"], description: "The top-level category most of its products are in (Electronics · ★ 4.9).", properties: { slug: { type: string }, name: { type: string } } }
        rating: { type: object, required: [avg, count], properties: { avg: { type: number }, count: { type: integer } } }
        positivePercent: { type: [integer, "null"] }
        followerCount: { type: integer }
    HomePage:
      type: object
      required: [categories, todaysDeals, bestSellers, topStores]
      properties:
        categories:
          type: array
          description: Shop by category (top-level categories).
          items: { type: object, required: [slug, name, productCount], properties: { slug: { type: string }, name: { type: string }, productCount: { type: integer } } }
        todaysDeals:
          type: object
          required: [endsAt, items]
          properties:
            endsAt: { type: [string, "null"], format: date-time, description: The soonest countdown among these deals ("Ends in 08h 42m 19s"). }
            items: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/ProductCard" } }
        bestSellers: { type: array, maxItems: 8, description: Most sold overall; the first is "#1 Best seller"., items: { $ref: "#/components/schemas/ProductCard" } }
        topStores: { type: array, maxItems: 6, description: By weighted rating., items: { $ref: "#/components/schemas/TopStore" } }
    WishlistItem:
      type: object
      required: [productId, slug, title, store, image, savedAt, savedPriceCentavos, available, card, priceDrop]
      properties:
        productId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        store: { type: object, required: [name, slug], properties: { name: { type: string }, slug: { type: string } } }
        image: { type: [object, "null"], properties: { url: { type: string }, alt: { type: [string, "null"] } } }
        savedAt: { type: string, format: date-time }
        savedPriceCentavos: { type: integer, description: The price when saved. }
        available: { type: boolean, description: false means "No longer available" (it stays until removed). }
        card:
          description: Everything a product card shows; null when no longer available.
          oneOf:
            - { $ref: "#/components/schemas/ProductCard" }
            - { type: "null" }
        priceDrop:
          type: [object, "null"]
          description: Today's price is below the saved price ("now ₱6,499, was ₱8,999"). Never for unavailable products.
          required: [wasCentavos, nowCentavos, savingsCentavos, savingsPercent]
          properties:
            wasCentavos: { type: integer }
            nowCentavos: { type: integer }
            savingsCentavos: { type: integer }
            savingsPercent: { type: integer }
    Wishlist:
      type: object
      required: [items, count, priceDrops]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/WishlistItem" } }
        count: { type: integer }
        priceDrops:
          type: object
          description: The "Price drop on 2 saved items… Deals end in 08h 42m" banner.
          required: [count, dealsEndAt]
          properties:
            count: { type: integer }
            dealsEndAt: { type: [string, "null"], format: date-time }
    WishlistChange:
      type: object
      required: [productId, saved, count]
      properties:
        productId: { type: string, format: uuid }
        saved: { type: boolean }
        savedPriceCentavos: { type: integer, description: Only when saved. }
        count: { type: integer, description: Items on the wishlist now. }
    CartLine:
      type: object
      required: [variantId, productId, slug, title, variantName, image, quantity, unitPriceCentavos, compareAtCentavos, saleEndsAt, lineTotalCentavos, stock, maxQuantity, priceChange, issue]
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        variantName: { type: string, example: Midnight Black }
        image: { type: [object, "null"], properties: { url: { type: string }, alt: { type: [string, "null"] } } }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPriceCentavos: { type: integer, description: Today's price after deal rules (what checkout charges). }
        compareAtCentavos: { type: [integer, "null"] }
        saleEndsAt: { type: [string, "null"], format: date-time }
        lineTotalCentavos: { type: integer }
        stock:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [in_stock, low_stock, out_of_stock] }
            left: { type: integer, description: Only for low_stock ("Only 3 left"). }
        maxQuantity: { type: integer, description: The most the quantity box allows (what's left, up to 99; 0 when unavailable). }
        priceChange: { type: [object, "null"], description: '"Price changed since you added it".', properties: { fromCentavos: { type: integer }, toCentavos: { type: integer } } }
        issue: { type: [string, "null"], enum: [unavailable, out_of_stock, not_enough_stock, null], description: What must be fixed before checkout. }
    CartGroup:
      type: object
      required: [store, items, subtotalCentavos, deliveryCentavos, freeDelivery, expressAvailable]
      properties:
        store: { type: object, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
        items: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
        subtotalCentavos: { type: integer, description: Lines without an issue. }
        deliveryCentavos: { type: integer, description: "Standard delivery for this store's package: free from ₱999, otherwise ₱49." }
        freeDelivery:
          type: object
          required: [thresholdCentavos, qualifies, remainingCentavos]
          description: '"Add ₱X more from this store for free delivery".'
          properties:
            thresholdCentavos: { type: integer, example: 99900 }
            qualifies: { type: boolean }
            remainingCentavos: { type: integer }
        expressAvailable: { type: boolean, description: "Express can be chosen at checkout only if every item here allows it (the seller's \"Offer Express delivery\")." }
    Cart:
      type: object
      required: [groups, summary]
      properties:
        groups: { type: array, description: One package per store, newest first., items: { $ref: "#/components/schemas/CartGroup" } }
        summary:
          type: object
          required: [itemCount, subtotalCentavos, savingsCentavos, deliveryCentavos, totalCentavos, issueCount, canCheckout]
          properties:
            itemCount: { type: integer }
            subtotalCentavos: { type: integer }
            savingsCentavos: { type: integer, description: '"You saved ₱3,300".' }
            deliveryCentavos: { type: integer }
            totalCentavos: { type: integer }
            issueCount: { type: integer }
            canCheckout: { type: boolean }
    CartMergeResult:
      type: object
      required: [added, adjusted, skipped]
      properties:
        added: { type: integer }
        adjusted: { type: array, description: Fewer than asked (stock or the 99 limit)., items: { type: object, properties: { variantId: { type: string, format: uuid }, quantity: { type: integer } } } }
        skipped: { type: array, items: { type: object, properties: { variantId: { type: string, format: uuid }, reason: { type: string, enum: [unavailable, sold_out, cart_full] } } } }
    AddressInput:
      type: object
      additionalProperties: false
      required: [fullName, phone, region, city, barangay, street, postalCode]
      properties:
        label: { type: [string, "null"], maxLength: 30, example: Home }
        fullName: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, example: "0917 123 4567", description: A Philippine mobile number in any common format; stored as +639XXXXXXXXX. }
        region: { type: string, enum: [NCR, CAR, Ilocos Region, Cagayan Valley, Central Luzon, CALABARZON, MIMAROPA, Bicol Region, Western Visayas, Negros Island Region, Central Visayas, Eastern Visayas, Zamboanga Peninsula, Northern Mindanao, Davao Region, SOCCSKSARGEN, Caraga, BARMM] }
        province: { type: [string, "null"], maxLength: 100, description: Required except in NCR (Metro Manila has none). }
        city: { type: string, minLength: 2, maxLength: 100 }
        barangay: { type: string, minLength: 1, maxLength: 100 }
        street: { type: string, minLength: 3, maxLength: 255, description: House number, street and building. }
        postalCode: { type: string, pattern: "^[0-9]{4}$" }
    Address:
      type: object
      required: [id, label, fullName, phone, region, province, city, barangay, street, postalCode, isDefault, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, "null"] }
        fullName: { type: string }
        phone: { type: string, example: "+639171234567" }
        region: { type: string }
        province: { type: [string, "null"] }
        city: { type: string }
        barangay: { type: string }
        street: { type: string }
        postalCode: { type: string }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
    DeliveryChoices:
      type: object
      description: Per store slug, STANDARD (free from ₱999, else ₱49) or EXPRESS (₱129). Stores left out get STANDARD.
      additionalProperties: { type: string, enum: [STANDARD, EXPRESS] }
      example: { soundcraft-audio: EXPRESS }
    CheckoutSummary:
      type: object
      required: [packages, address, paymentMethods, totals, canPlaceOrder, blockers]
      properties:
        packages:
          type: array
          items:
            type: object
            required: [store, items, subtotalCentavos, delivery]
            properties:
              store: { type: object, properties: { slug: { type: string }, name: { type: string } } }
              items: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
              subtotalCentavos: { type: integer }
              delivery:
                type: object
                properties:
                  option: { type: string, enum: [STANDARD, EXPRESS] }
                  feeCentavos: { type: integer }
                  days: { type: object, properties: { min: { type: integer }, max: { type: integer } } }
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        option: { type: string, enum: [STANDARD, EXPRESS] }
                        feeCentavos: { type: integer }
                        days: { type: object }
                        available: { type: boolean, description: "Express is offered only when every item in the package allows it; an unavailable Express choice is quoted as Standard." }
        address: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }] }
        paymentMethods:
          type: array
          items:
            type: object
            required: [method, available, reason]
            properties:
              method: { type: string, enum: [GCASH, MAYA, CARD, COD] }
              available: { type: boolean }
              reason: { type: [string, "null"], example: "Not available for orders over ₱5,000" }
        totals:
          type: object
          properties:
            subtotalCentavos: { type: integer }
            deliveryCentavos: { type: integer }
            discountCentavos: { type: integer }
            totalCentavos: { type: integer, description: Send this back as expectedTotalCentavos. }
            savingsCentavos: { type: integer }
        canPlaceOrder: { type: boolean }
        blockers: { type: array, items: { type: string, enum: [cart_empty, cart_issues, no_address] } }
    Order:
      type: object
      required: [id, number, status, createdAt, placedAt, cancelledAt, payment, packages, itemCount, totals, address]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: VD-21458 }
        status: { type: string, enum: [PENDING_PAYMENT, PLACED, COMPLETED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        placedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        canCancel: { type: boolean, description: '"Cancel order": paid less than an hour ago and something not shipped yet.' }
        cancelUntil: { type: [string, "null"], format: date-time, description: An hour after paying (while canCancel). }
        payment:
          type: object
          required: [method, status, checkoutUrl, expiresAt, paidAt]
          properties:
            method: { type: string, enum: [GCASH, MAYA, CARD, COD] }
            status: { type: string, enum: [PENDING, AWAITING_ACTION, PAID, FAILED, EXPIRED, REFUNDED] }
            checkoutUrl: { type: [string, "null"], description: Unpaid online orders only ("Continue to payment"). }
            expiresAt: { type: [string, "null"], format: date-time, description: Unpaid online orders only; the 15-minute window. }
            paidAt: { type: [string, "null"], format: date-time }
        packages:
          type: array
          description: One per store, in the cart's order.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              store:
                type: object
                description: The seller card on the tracking page.
                properties:
                  slug: { type: string }
                  name: { type: string }
                  logoUrl: { type: [string, "null"] }
                  rating: { type: object, properties: { avg: { type: number }, count: { type: integer } } }
              status: { type: string, enum: [AWAITING_PAYMENT, PREPARING, SHIPPED, DELIVERED, CANCELLED, RETURN_REQUESTED, RETURNED] }
              deliveryOption: { type: string, enum: [STANDARD, EXPRESS] }
              deliveryDays: { type: object, properties: { min: { type: integer }, max: { type: integer } } }
              subtotalCentavos: { type: integer }
              deliveryCentavos: { type: integer }
              courier: { type: [string, "null"], example: LBC, description: Set by the seller when shipping (milestone 6). }
              trackingNumber: { type: [string, "null"], example: 8841 2201 }
              shipBy: { type: [string, "null"], format: date-time, description: "The seller's deadline: 6:00 PM (Manila), 2 days after payment." }
              shippedAt: { type: [string, "null"], format: date-time }
              deliveredAt: { type: [string, "null"], format: date-time }
              cancelledAt: { type: [string, "null"], format: date-time }
              canConfirmReceived: { type: boolean, description: '"Order received": while the package is shipped.' }
              autoConfirmAt: { type: [string, "null"], format: date-time, description: 'While shipped: "We''ll confirm it automatically on Nov 30" (7 days after shipping).' }
              deliveryConfirmedBy: { type: [string, "null"], enum: [buyer, auto, null], description: Who confirmed the delivery. }
              cancellation:
                type: [object, "null"]
                description: A paid package that was cancelled.
                properties:
                  by: { type: string, enum: [seller, buyer, system] }
                  reason: { type: string, enum: [OUT_OF_STOCK, CANNOT_SHIP_TO_ADDRESS, BUYER_ASKED, BUYER_CANCELLED, NOT_SHIPPED_IN_TIME] }
                  message: { type: string, example: Cancelled by the seller · out of stock }
              refund:
                type: [object, "null"]
                description: 'The money for a cancelled package: processing (PayMongo has not taken it yet), sent, or delayed (a person is sending it by hand).'
                properties:
                  amountCentavos: { type: integer }
                  status: { type: string, enum: [processing, sent, delayed] }
                  sentAt: { type: [string, "null"], format: date-time }
              estimatedDelivery: { $ref: "#/components/schemas/DeliveryEstimate" }
              steps:
                type: array
                description: The tracking stepper, always these 4 in this order; `at` is when each was reached (null = not yet).
                items:
                  type: object
                  properties:
                    step: { type: string, enum: [ORDERED, PREPARING, SHIPPED, DELIVERED] }
                    at: { type: [string, "null"], format: date-time }
              events: { type: array, description: The timeline, newest first., items: { $ref: "#/components/schemas/TrackingEvent" } }
              items:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid, description: The order item (what a review is written for). }
                    productId: { type: string, format: uuid }
                    variantId: { type: string, format: uuid }
                    title: { type: string }
                    variantName: { type: string }
                    imageUrl: { type: [string, "null"] }
                    unitPriceCentavos: { type: integer, description: The price when ordered. }
                    quantity: { type: integer }
                    lineTotalCentavos: { type: integer }
                    review: { oneOf: [{ $ref: "#/components/schemas/MyReview" }, { type: "null" }], description: Your review of this item, if any. }
                    canReview: { type: boolean, description: '"Write a review": delivered and not reviewed yet.' }
        itemCount: { type: integer }
        totals: { type: object, properties: { subtotalCentavos: { type: integer }, deliveryCentavos: { type: integer }, discountCentavos: { type: integer }, totalCentavos: { type: integer } } }
        address: { type: object, description: The address copied at checkout (editing the address book doesn't change it). }
    PlacedOrder:
      type: object
      required: [order, nextAction]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        nextAction:
          type: [object, "null"]
          description: Online payment; send the shopper to PayMongo's page.
          properties:
            type: { type: string, const: redirect }
            url: { type: string, example: "https://checkout.paymongo.com/cs_…" }
    DeliveryEstimate:
      type: [object, "null"]
      description: '"Arrives Nov 24 – Nov 27": the delivery promise (Standard 2–5 days, Express 1–2) counted from when the order was paid; only while preparing or shipped.'
      properties:
        earliest: { type: string, format: date-time }
        latest: { type: string, format: date-time }
    TrackingEvent:
      type: object
      required: [type, message, location, at]
      properties:
        type: { type: string, enum: [placed, shipped, update, delivered, cancelled, refund], description: "update = an extra courier update; refund = \"Refund of ₱549 sent to your GCash\"." }
        message: { type: string, example: Shipped with LBC · tracking 8841 2201, description: 'Also "Delivered · you confirmed you received it" or "Delivered · confirmed automatically 7 days after shipping".' }
        location: { type: [string, "null"], example: Pasay City }
        at: { type: string, format: date-time }
    OrderCard:
      type: object
      description: One order on "Your orders".
      required: [id, number, status, createdAt, placedAt, cancelledAt, paymentMethod, totalCentavos, itemCount, packages]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: VD-21458 }
        status: { type: string, enum: [PENDING_PAYMENT, PLACED, COMPLETED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        placedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        paymentMethod: { type: string, enum: [GCASH, MAYA, CARD, COD] }
        totalCentavos: { type: integer }
        itemCount: { type: integer }
        packages:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              store: { type: object, properties: { slug: { type: string }, name: { type: string } } }
              status: { type: string, enum: [AWAITING_PAYMENT, PREPARING, SHIPPED, DELIVERED, CANCELLED, RETURN_REQUESTED, RETURNED] }
              itemCount: { type: integer }
              items:
                type: array
                maxItems: 3
                description: The first 3 items ("AuraSound Pro … + 1 more").
                items: { type: object, properties: { title: { type: string }, variantName: { type: string }, imageUrl: { type: [string, "null"] }, quantity: { type: integer } } }
              moreItems: { type: integer }
              estimatedDelivery: { $ref: "#/components/schemas/DeliveryEstimate" }
              courier: { type: [string, "null"] }
              trackingNumber: { type: [string, "null"] }
              shippedAt: { type: [string, "null"], format: date-time }
              deliveredAt: { type: [string, "null"], format: date-time }
              canConfirmReceived: { type: boolean, description: '"Order received": while the package is shipped.' }
              reviewableItems: { type: integer, description: Delivered items not reviewed yet ("Write a review" when > 0). }
    OrderList:
      type: object
      required: [items, counts, page, pageSize, totalItems, totalPages]
      properties:
        items: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/OrderCard" } }
        counts:
          type: object
          description: For the tabs ("To ship (1)"), regardless of the search.
          properties: { all: { type: integer }, toShip: { type: integer }, onTheWay: { type: integer }, delivered: { type: integer } }
        page: { type: integer }
        pageSize: { type: integer, const: 10 }
        totalItems: { type: integer }
        totalPages: { type: integer }
    MyReview:
      type: object
      description: A review as its author sees it.
      required: [id, orderItemId, productId, rating, title, body, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, "null"] }
        body: { type: [string, "null"] }
        status: { type: string, enum: [PUBLISHED, HIDDEN], description: HIDDEN = taken off the product page by moderation (milestone 7). }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Recommendations:
      type: object
      required: [basedOn, items, seeAll]
      properties:
        basedOn: { type: string, enum: [cart, you, popular], description: 'For the subtitle: cart = "Based on your cart"; you = wishlist or followed stores; popular = best sellers or top rated.' }
        items: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/ProductCard" } }
        seeAll:
          type: [object, "null"]
          description: '"See all": search this category (the one most of the cart is in). Null for an empty cart.'
          properties: { categorySlug: { type: string }, categoryName: { type: string } }
    UploadedFile:
      type: object
      additionalProperties: false
      required: [publicId]
      properties:
        publicId: { type: string, description: The `publicId` of the upload ticket the file was uploaded with. }
    UploadTicket:
      type: object
      required: [url, fields, publicId, allowedFormats, maxBytes, expiresAt]
      properties:
        url: { type: string, example: "https://api.cloudinary.com/v1_1/<cloud>/image/upload" }
        fields: { type: object, additionalProperties: { type: string }, description: Send every one of these with the file (signed; any change is refused). }
        publicId: { type: string, example: vendora/store-logos/0193c0de-…/q3Zr8kLpT1xV0aBc }
        allowedFormats: { type: array, items: { type: string }, example: [jpg, png, webp] }
        maxBytes: { type: integer, example: 5242880 }
        expiresAt: { type: string, format: date-time, description: One hour. }
    SellerOnboarding:
      type: object
      required: [twoFactorEnabled, store, steps, missing, canSubmit]
      properties:
        twoFactorEnabled: { type: boolean, description: Required before any step can be saved. }
        store:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string, description: The store page's web address. }
            status: { type: string, enum: [DRAFT, PENDING, CHANGES_REQUESTED, APPROVED, REJECTED, SUSPENDED], description: "CHANGES_REQUESTED: an admin asked for changes (see review); edit and submit again. REJECTED: final." }
            category: { type: [object, "null"], properties: { slug: { type: string }, name: { type: string } } }
            description: { type: [string, "null"] }
            shipsFrom: { type: [string, "null"] }
            logoUrl: { type: [string, "null"] }
            submittedAt: { type: [string, "null"], format: date-time }
            approvedAt: { type: [string, "null"], format: date-time }
            verification:
              type: object
              properties:
                businessType: { type: string, enum: [INDIVIDUAL, REGISTERED_BUSINESS] }
                legalName: { type: [string, "null"] }
                registrationNo: { type: [string, "null"] }
                tinLast3: { type: [string, "null"], description: '"TIN ending in 000": the full number is never sent back.' }
            documents:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string, enum: [GOV_ID, DTI_CERT, SEC_CERT, BIR_2303, SELFIE] }
                  format: { type: [string, "null"], example: pdf }
                  bytes: { type: [integer, "null"], example: 860000 }
                  status: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
                  createdAt: { type: string, format: date-time }
            payoutAccount:
              type: [object, "null"]
              properties:
                method: { type: string, enum: [GCASH, BANK] }
                bankName: { type: [string, "null"] }
                accountName: { type: string }
                last4: { type: string, example: "4567" }
                verifiedAt: { type: [string, "null"], format: date-time }
            review:
              type: [object, "null"]
              description: "The admin's note when changes were requested or the application was rejected."
              properties:
                status: { type: string, enum: [CHANGES_REQUESTED, REJECTED] }
                note: { type: string }
                reviewedAt: { type: [string, "null"], format: date-time }
            suspension:
              type: [object, "null"]
              description: Suspended (7c-2). The store can look but not change anything; paid orders still ship.
              properties:
                at: { type: [string, "null"], format: date-time }
                reason: { type: [string, "null"], description: "Support's reason (null when the store went down with the owner's account)." }
                until: { type: [string, "null"], format: date-time }
        steps: { type: object, properties: { storeDetails: { type: boolean }, verification: { type: boolean }, payoutAccount: { type: boolean } } }
        missing:
          type: array
          items: { type: string, enum: [two_factor, store_details, verification, gov_id, business_certificate, payout_account] }
        canSubmit: { type: boolean }
        refreshSession: { type: boolean, const: true, description: 'After submitting: call POST /auth/refresh to get the seller role.' }
    SellerProductInput:
      type: object
      additionalProperties: false
      required: [intent, title, category]
      properties:
        intent: { type: string, enum: [draft, publish], description: Save draft (title + category are enough) or Publish (everything is checked). }
        version: { type: integer, minimum: 1, description: Edits only, the version the form was loaded with. }
        title: { type: string, minLength: 3, maxLength: 200 }
        category: { type: string, description: A sub-category's slug., example: headphones }
        description: { type: string, maxLength: 5000, default: "", description: At least 20 characters to publish. }
        variantLabel: { type: string, minLength: 1, maxLength: 30, default: Color, example: Size }
        variants:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [name, priceCentavos, stock]
            properties:
              id: { type: string, format: uuid, description: An existing variant (leave out for a new one). }
              name: { type: string, minLength: 1, maxLength: 100, example: Midnight Black }
              sku: { type: [string, "null"], maxLength: 64, description: Empty = made up. Unique in the store. }
              priceCentavos: { type: integer, minimum: 100, maximum: 100000000 }
              compareAtCentavos: { type: [integer, "null"], description: The crossed-out price, higher than the price. }
              stock: { type: integer, minimum: 0, maximum: 100000 }
              stockWas: { type: integer, description: 'Existing variants: the stock the form showed (the change is applied as a difference).' }
        photos:
          type: array
          maxItems: 8
          description: In order; the first is the cover.
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string, format: uuid, description: A photo already on the product. }
              publicId: { type: string, description: A new upload (from a product_photo ticket). }
              alt: { type: [string, "null"], maxLength: 200 }
        specs:
          type: array
          maxItems: 30
          items: { type: object, additionalProperties: false, required: [label, value], properties: { label: { type: string, maxLength: 40 }, value: { type: string, maxLength: 200 } } }
        dealEndsAt: { type: [string, "null"], format: date-time, description: The deal countdown (needs a compare-at price; within 90 days). }
        weightGrams: { type: [integer, "null"], minimum: 1, maximum: 50000 }
        active: { type: boolean, default: true, description: Off hides a published product. }
        expressAvailable: { type: boolean, default: true }
        lowStockAlert: { type: boolean, default: true }
    SellerProduct:
      type: object
      required: [id, slug, status, version, title, category, description, variantLabel, variants, dealEndsAt, photos, specs, weightGrams, shipsFrom, active, expressAvailable, lowStockAlert, visibleToShoppers, canDelete, publishedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        status: { type: string, enum: [draft, active, inactive, removed] }
        version: { type: integer }
        title: { type: string }
        category:
          type: object
          properties: { slug: { type: string }, name: { type: string }, parent: { type: [object, "null"], properties: { slug: { type: string }, name: { type: string } } } }
        description: { type: string }
        variantLabel: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              sku: { type: string }
              priceCentavos: { type: integer }
              compareAtCentavos: { type: [integer, "null"] }
              stock: { type: integer }
        dealEndsAt: { type: [string, "null"], format: date-time }
        photos: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, url: { type: string }, alt: { type: [string, "null"] } } } }
        specs: { type: array, items: { type: object, properties: { label: { type: string }, value: { type: string } } } }
        weightGrams: { type: [integer, "null"] }
        shipsFrom: { type: [string, "null"], description: "The store's own setting (read-only here)." }
        active: { type: boolean }
        expressAvailable: { type: boolean }
        lowStockAlert: { type: boolean }
        visibleToShoppers: { type: boolean, description: Active, something on sale, and the store approved. }
        canDelete: { type: boolean, description: Only products that never sold. }
        publishedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SellerProductList:
      type: object
      required: [items, counts, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: [string, "null"], format: uuid, description: Null for a draft without variants. }
              title: { type: string }
              variantName: { type: [string, "null"] }
              sku: { type: [string, "null"] }
              image: { type: [object, "null"], properties: { url: { type: string }, alt: { type: [string, "null"] } } }
              priceCentavos: { type: [integer, "null"] }
              compareAtCentavos: { type: [integer, "null"] }
              stock: { type: [integer, "null"] }
              stockLeft: { type: [integer, "null"], description: '"9 left": set when 1–9 are left.' }
              sold30d: { type: integer }
              status: { type: string, enum: [active, draft, out_of_stock, inactive, removed] }
        counts: { type: object, properties: { all: { type: integer }, active: { type: integer }, drafts: { type: integer }, out_of_stock: { type: integer } } }
        page: { type: integer }
        pageSize: { type: integer, example: 20 }
        totalItems: { type: integer }
        totalPages: { type: integer }
    SellerOrderList:
      type: object
      required: [items, counts, alerts, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              id: { type: string, format: uuid, description: The package (seller order) id. }
              number: { type: string, example: VD-21458 }
              placedAt: { type: string, format: date-time }
              customer: { type: object, properties: { name: { type: string, example: Maria S. }, city: { type: string, example: Manila } } }
              items:
                type: object
                description: '"AuraSound Pro + 1 more" · "2 items".'
                properties:
                  first: { type: object, properties: { title: { type: string }, variantName: { type: string }, imageUrl: { type: [string, "null"] }, quantity: { type: integer } } }
                  moreLines: { type: integer }
                  units: { type: integer }
              subtotalCentavos: { type: integer, description: "This store's items (the delivery fee isn't the seller's)." }
              deliveryOption: { type: string, enum: [STANDARD, EXPRESS] }
              paymentMethod: { type: string, enum: [GCASH, MAYA, CARD, COD] }
              status: { type: string, enum: [PREPARING, SHIPPED, DELIVERED, CANCELLED, RETURN_REQUESTED, RETURNED], description: PREPARING is shown as "To ship". }
              shipBy: { type: [string, "null"], format: date-time }
              late: { type: boolean, description: Still to ship after its ship-by time. }
              courier: { type: [string, "null"] }
              trackingNumber: { type: [string, "null"] }
              shippedAt: { type: [string, "null"], format: date-time }
              deliveredAt: { type: [string, "null"], format: date-time }
        counts: { type: object, properties: { toShip: { type: integer }, shipped: { type: integer }, delivered: { type: integer }, all: { type: integer } } }
        alerts:
          type: object
          properties:
            dueToday: { type: integer, description: "To ship by today's 6:00 PM (Manila) and not late yet." }
            dueBy: { type: string, format: date-time, description: "Today's 6:00 PM in Manila." }
            late: { type: integer }
        page: { type: integer }
        pageSize: { type: integer, const: 20 }
        totalItems: { type: integer }
        totalPages: { type: integer }
    SellerOrder:
      type: object
      description: "The seller's order page. Only this store's part of the order."
      required: [id, number, status, late, placedAt, paymentMethod, deliveryOption, shipBy, shippedAt, deliveredAt, deliveryConfirmedBy, autoConfirmAt, shipment, suggestedWeightGrams, canShip, canEditShipment, canCancel, autoCancelAt, cancellation, items, customer, shipTo, earnings, timeline, next, store]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: VD-21458 }
        status: { type: string, enum: [PREPARING, SHIPPED, DELIVERED, CANCELLED, RETURN_REQUESTED, RETURNED] }
        late: { type: boolean }
        placedAt: { type: string, format: date-time }
        paymentMethod: { type: string, enum: [GCASH, MAYA, CARD, COD] }
        deliveryOption: { type: string, enum: [STANDARD, EXPRESS] }
        shipBy: { type: [string, "null"], format: date-time }
        shippedAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        deliveryConfirmedBy: { type: [string, "null"], enum: [buyer, auto, null] }
        autoConfirmAt: { type: [string, "null"], format: date-time, description: "While shipped, when it's confirmed automatically." }
        shipment:
          type: [object, "null"]
          properties: { courier: { type: string }, trackingNumber: { type: string }, packageWeightGrams: { type: [integer, "null"] } }
        suggestedWeightGrams: { type: [integer, "null"], description: "The items' weights added up (when every item has one): the form's starting value." }
        canShip: { type: boolean }
        canEditShipment: { type: boolean, description: Shipped and not delivered yet (fixing a typo). }
        canCancel: { type: boolean, description: '"Cancel order": still to ship.' }
        autoCancelAt: { type: [string, "null"], format: date-time, description: "While to ship: when it's cancelled automatically (3 days after ship-by)." }
        cancellation:
          type: [object, "null"]
          properties:
            by: { type: string, enum: [seller, buyer, system] }
            reason: { type: string, enum: [OUT_OF_STOCK, CANNOT_SHIP_TO_ADDRESS, BUYER_ASKED, BUYER_CANCELLED, NOT_SHIPPED_IN_TIME] }
            message: { type: string, example: You cancelled it · out of stock }
            at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              title: { type: string }
              variantName: { type: string }
              sku: { type: string }
              imageUrl: { type: [string, "null"] }
              unitPriceCentavos: { type: integer }
              quantity: { type: integer }
              lineTotalCentavos: { type: integer }
        customer: { type: object, properties: { name: { type: string, example: Maria S. }, ordersWithStore: { type: integer, description: '"3 orders with your store".' } } }
        shipTo:
          type: object
          description: The full address while it needs shipping; after delivery or cancellation only the name ("Maria S."), city, province and region (`hidden` true).
          properties:
            name: { type: string }
            phone: { type: [string, "null"] }
            street: { type: [string, "null"] }
            barangay: { type: [string, "null"] }
            city: { type: string }
            province: { type: [string, "null"] }
            region: { type: string }
            postalCode: { type: [string, "null"] }
            hidden: { type: boolean }
        earnings:
          type: object
          description: '"Your earnings": items subtotal − Vendora fee = you receive; released 7 days after delivery.'
          properties:
            subtotalCentavos: { type: integer }
            feeCentavos: { type: integer }
            feePercent: { type: integer, enum: [0, 5], description: "0 in a store's first 30 days." }
            netCentavos: { type: integer }
            status: { type: string, enum: [after_delivery, on_hold, available, cancelled] }
            availableAt: { type: [string, "null"], format: date-time }
        timeline:
          type: array
          description: Oldest first.
          items: { type: object, properties: { type: { type: string, enum: [paid, placed, shipped, delivered, cancelled] }, message: { type: string }, at: { type: string, format: date-time } } }
        next:
          type: [object, "null"]
          description: '"Waiting for you to ship" by the ship-by time, "Waiting for the buyer to confirm delivery", or when the earnings are released.'
          properties: { message: { type: string }, by: { type: string, format: date-time } }
        store: { type: object, description: For the packing slip., properties: { name: { type: string }, shipsFrom: { type: [string, "null"] } } }
    SellerDashboard:
      type: object
      required: [store, period, stats, chart, recentOrders, tasks]
      properties:
        store: { type: object, properties: { name: { type: string }, status: { type: string, enum: [PENDING, APPROVED, REJECTED, SUSPENDED] } } }
        period: { type: object, properties: { days: { type: integer, enum: [7, 30] }, from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
        stats:
          type: object
          description: '`change` is the percent change against the period before (null when the period before had none); rating.change is in stars.'
          properties:
            sales: { type: object, properties: { centavos: { type: integer }, previousCentavos: { type: integer }, change: { type: [number, "null"] } } }
            orders: { type: object, properties: { count: { type: integer }, previous: { type: integer }, change: { type: [number, "null"] }, toShipToday: { type: integer, description: Due by today's 6:00 PM, late ones included. } } }
            visits: { type: object, properties: { count: { type: integer }, previous: { type: integer }, change: { type: [number, "null"] } } }
            rating: { type: object, properties: { average: { type: number }, count: { type: integer }, change: { type: [number, "null"] } } }
        chart:
          type: object
          properties:
            days: { type: array, items: { type: object, properties: { day: { type: string, example: 2026-11-25 }, salesCentavos: { type: integer } } } }
            totalCentavos: { type: integer }
            bestDay: { type: [string, "null"] }
        recentOrders: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/SellerOrderList/properties/items/items" } }
        tasks:
          type: array
          description: Needs attention, most urgent first.
          items:
            type: object
            properties:
              kind: { type: string, enum: [store_review, store_suspended, late, ship_today, out_of_stock, low_stock, payout_account] }
              count: { type: integer }
              title: { type: string, example: 3 orders to ship today }
              detail: { type: string, example: "Ship by Nov 25, 6:00 PM." }
    SellerPayouts:
      type: object
      required: [available, waiting, paidThisMonth, account, schedule, canRequest, cannotRequest, history]
      properties:
        available: { type: object, properties: { centavos: { type: integer } } }
        waiting: { type: object, properties: { centavos: { type: integer }, orders: { type: integer } } }
        paidThisMonth: { type: object, properties: { month: { type: string, example: 2026-11 }, centavos: { type: integer }, previousCentavos: { type: integer }, change: { type: [number, "null"] } } }
        account:
          type: [object, "null"]
          properties:
            method: { type: string, enum: [GCASH, BANK] }
            bankName: { type: [string, "null"] }
            accountName: { type: string }
            last4: { type: string }
            verified: { type: boolean }
            verifiedAt: { type: [string, "null"], format: date-time }
