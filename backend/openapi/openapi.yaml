      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [OUT_OF_STOCK, CANNOT_SHIP_TO_ADDRESS, BUYER_ASKED], description: 'The Modal''s reasons: "Out of stock" (the stock is set to 0), "Can''t ship to this address", "Buyer asked to cancel".' }
    ShipmentInput:
      type: object
      additionalProperties: false
      required: [courier, trackingNumber]
      properties:
        courier: { type: string, enum: [J&T Express, LBC, Ninja Van, Flash Express, 2GO Express, GoGo Xpress] }
        trackingNumber: { type: string, maxLength: 60, example: 7720 1934 5512, description: 6–30 letters and digits after spaces and dashes are removed. }
        packageWeightGrams: { type: [integer, "null"], minimum: 1, maximum: 100000, default: null }
    EmailPreferences:
      type: object
      additionalProperties: false
      required: [priceDrops]
      properties:
        priceDrops: { type: boolean, description: Price-drop emails for wishlist items (at most one a day). }
    RatingSummary:
      type: object
      required: [avg, count, stars]
      properties:
        avg: { type: number, example: 4.62, description: Same rounding as the stored rating on the product or store. }
        count: { type: integer, example: 89 }
        stars:
          type: array
          description: 5★ down to 1★, for the "5 star ███ 72%" bars.
          items:
            type: object
            required: [stars, count, percent]
            properties:
              stars: { type: integer, minimum: 1, maximum: 5 }
              count: { type: integer }
              percent: { type: integer, example: 72 }
    Review:
      type: object
      required: [id, rating, title, body, author, variantName, verifiedPurchase, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, "null"] }
        body: { type: [string, "null"] }
        author: { type: string, example: Maria S., description: First name and initial only. }
        variantName: { type: string, example: Midnight Black, description: The variant that was bought. }
        verifiedPurchase: { type: boolean, const: true }
        createdAt: { type: string, format: date-time }
        product:
          type: object
          description: Store reviews only.
          required: [id, title, available]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            available: { type: boolean, description: Whether the product page can still be opened. }
    ReviewList:
      type: object
      required: [summary, items, page, pageSize, totalItems, totalPages]
      properties:
        summary: { $ref: "#/components/schemas/RatingSummary" }
        items: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Review" } }
        page: { type: integer }
        pageSize: { type: integer, const: 10 }
        totalItems: { type: integer, description: Reviews matching the star filter (all of them without one). }
        totalPages: { type: integer, maximum: 50 }
    StorePage:
      type: object
      required: [id, slug, name, description, logoUrl, bannerUrl, shipsFrom, verified, sellingSince, rating, positivePercent, followerCount, productCount, dealCount, categories, shipsWithinHours, returns]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: soundcraft-audio }
        name: { type: string, example: SoundCraft Audio }
        description: { type: [string, "null"] }
        logoUrl: { type: [string, "null"] }
        bannerUrl: { type: [string, "null"] }
        shipsFrom: { type: [string, "null"], example: Manila }
        verified: { type: boolean, description: Every store passes document review before it can sell. }
        sellingSince: { type: integer, example: 2025, description: '"On Vendora since 2025"' }
        rating: { type: object, required: [avg, count], properties: { avg: { type: number }, count: { type: integer } } }
        positivePercent: { type: [integer, "null"], example: 98, description: Share of 4★ and 5★ reviews in the last 12 months, rounded down; null without recent reviews. }
        followerCount: { type: integer, example: 12400 }
        productCount: { type: integer }
        dealCount: { type: integer, description: Products on a deal (the "Deals" chip). }
        categories:
          type: array
          description: The category chips, biggest first.
          items: { type: object, required: [slug, name, count], properties: { slug: { type: string }, name: { type: string }, count: { type: integer } } }
        shipsWithinHours: { type: [integer, "null"], example: 19, description: "90% of the last 90 days' orders shipped within this many hours; null with fewer than 5 orders." }
        returns: { type: object, properties: { days: { type: integer, example: 30 } } }
    FollowState:
      type: object
      required: [following, followerCount]
      properties:
        following: { type: boolean }
        followerCount: { type: integer }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Maria Santos }
        email: { type: string, format: email, maxLength: 254, example: maria.santos@gmail.com }
        password: { type: string, minLength: 8, maxLength: 128, description: "At least 8 characters; not in a known data breach." }

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$", example: "482913" }
        keepSignedIn: { type: boolean, default: false }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 128 }
        keepSignedIn:
          type: boolean
          default: false
          description: "\"Keep me signed in on this device\": 30 days. Otherwise sign-in ends when the browser closes (at most 1 day)."

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: "The part after #token= in the emailed link." }
        password: { type: string, minLength: 8, maxLength: 128, description: "At least 8 characters; not in a known data breach." }
        keepSignedIn: { type: boolean, default: false }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 128, description: "Different from the current one; not in a known data breach." }

    ResetLinkSent:
      type: object
      required: [status, email, expiresInSeconds]
      properties:
        status: { type: string, const: reset_link_sent }
        email: { type: string, format: email }
        expiresInSeconds: { type: integer, example: 1800 }

    VerificationSent:
      type: object
      required: [status, email, codeExpiresInSeconds]
      properties:
        status: { type: string, const: verification_sent }
        email: { type: string, format: email }
        codeExpiresInSeconds: { type: integer, example: 600 }

  parameters:
    StoreSlug: { name: slug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" }, example: soundcraft-audio }
    ReviewRating: { name: rating, in: query, description: Only reviews with this many stars (clicking a bar)., schema: { type: integer, minimum: 1, maximum: 5 } }
    ReviewSort: { name: sort, in: query, schema: { type: string, enum: [newest, highest, lowest], default: newest } }
    ReviewPage: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }

  responses:
    SignedIn:
      description: Signed in. Sets the `vd_at` and `vd_rt` cookies (httpOnly) and returns a new CSRF token.
      headers:
        Set-Cookie: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SignedIn" }
    ServiceUnavailable:
      description: |
        SERVICE_UNAVAILABLE. Redis (sign-in limits and lockouts) did not answer, so sign-in, sign-up,
        code and password endpoints refuse rather than run without brute-force protection.
        Retry after the seconds in the Retry-After header.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait before retrying. }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SignInStep:
      description: Signed in (cookies set), or one more step first (2FA code or set-up; vd_2fa cookie set).
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/SignedIn" }
              - { $ref: "#/components/schemas/TwoFactorStep" }
    Unauthorized:
      description: UNAUTHORIZED. Not signed in (or the access pass expired; refresh and retry).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CsrfInvalid:
      description: CSRF_INVALID. Missing or wrong X-CSRF-Token, or the request came from another website.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Malformed JSON (INVALID_JSON) or invalid input (VALIDATION_ERROR).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SellerOnboarding:
      description: The whole onboarding state after the change.
      content: { application/json: { schema: { $ref: "#/components/schemas/SellerOnboarding" } } }
    SellerProduct:
      description: The product, as the Edit product form shows it.
      content: { application/json: { schema: { type: object, required: [product], properties: { product: { $ref: "#/components/schemas/SellerProduct" } } } } }
    SellerProductConflict:
      description: |
        CONFLICT, with `details.reason`: stale (changed elsewhere; reload), stock_changed (with the variant's
        `stock` field), already_published, has_orders, already_used (a SKU or photo was just used elsewhere).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SellerOrder:
      description: The order, as the seller's order page shows it.
      content: { application/json: { schema: { type: object, required: [order], properties: { order: { $ref: "#/components/schemas/SellerOrder" } } } } }
    EmailPreferences:
      description: The email settings.
      content: { application/json: { schema: { $ref: "#/components/schemas/EmailPreferences" } } }
    Application:
      description: The application after the change.
      content: { application/json: { schema: { type: object, required: [application], properties: { application: { $ref: "#/components/schemas/Application" } } } } }
    ApplicationConflict:
      description: "CONFLICT, with `details.reason`; not_pending (it isn't waiting for review any more: another admin decided, or the seller hasn't resubmitted), owner_suspended (on Approve: the owner's account is suspended)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PayoutAccountsToCheck:
      description: The payout accounts waiting to be checked.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  type: object
                  properties:
                    storeId: { type: string, format: uuid }
                    store: { type: object, properties: { name: { type: string }, slug: { type: string } } }
                    owner: { type: object, properties: { name: { type: string }, email: { type: string } } }
                    method: { type: string, enum: [GCASH, BANK] }
                    bankName: { type: [string, "null"] }
                    accountName: { type: string }
                    last4: { type: string }
                    changedAt: { type: string, format: date-time }
    AdminStore:
      description: The store (after the change).
      content: { application/json: { schema: { type: object, required: [store], properties: { store: { $ref: "#/components/schemas/AdminStore" } } } } }
    AdminUser:
      description: The account (after the change).
      content: { application/json: { schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/AdminUser" } } } } }
    AdminPayout:
      description: The payout after the change.
      content: { application/json: { schema: { type: object, required: [payout], properties: { payout: { $ref: "#/components/schemas/AdminPayout" } } } } }
    PayoutNotProcessing:
      description: CONFLICT (`not_processing`). It was already marked paid or failed (by another admin, perhaps).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AdminForbidden:
      description: FORBIDDEN, with `details.reason`; not_an_admin, two_factor_required, missing_role (with `details.role`). Actions that decide where money goes also need "Confirm it's you" (403 REAUTH_REQUIRED).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SellerForbidden:
      description: |
        FORBIDDEN, with `details.reason`; two_factor_required (turn on two-step verification first), admin_account,
        store_suspended (a suspended store can look but not change anything; it can still ship paid orders),
        store_rejected (a rejected application: looking only),
        not_a_seller (Seller Center needs a store submitted for review), removed_by_vendora (a product taken down
        by Vendora can't be changed).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UploadsUnavailable:
      description: SERVICE_UNAVAILABLE. The storage service isn't set up or didn't answer; try again.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Unknown route or resource.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PayloadTooLarge:
      description: JSON body larger than the 10 KB limit (64 KB for the product form).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Rate limit reached. RateLimit-* headers say when to retry.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InternalError:
      description: Unexpected server error — generic message only.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
