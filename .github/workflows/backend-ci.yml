name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, migrate, seed, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # A throwaway real PostgreSQL, only for this run (test credentials, not secrets).
      # Same major version as the Neon database (18), so CI tests what we actually run.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vendora
          POSTGRES_PASSWORD: vendora
          POSTGRES_DB: vendora_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vendora -d vendora_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vendora:vendora@localhost:5432/vendora_ci
      DIRECT_URL: postgresql://vendora:vendora@localhost:5432/vendora_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The same migration + demo data on a real PostgreSQL server (seeding twice proves it's repeatable)
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run db:status
      - run: npm run build
